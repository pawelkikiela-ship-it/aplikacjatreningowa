    const f=d.querySelector(`#stf-${id}-${k}`);const t=f&&f.querySelector('textarea,input[type=text],input:not([type])');if(t&&k==='change')t.focus();});

    const body=k==='done'?{id,done:true,doneNote:note,effort}:{id,change,effort};
    const rv=snapPlan(id);

    bgApi('planDone',body,rv);

    bgApi('planDone',{id,done:false,skip:null,change:null,effort:null,doneNote:''},rv);toast('Cofnięto status.');},b));
  d.querySelectorAll('[data-steff]').forEach(b=>b.onclick=()=>{d.querySelector(`#stf-${b.dataset.steff}-eff`).hidden=false;b.hidden=true;});

  d.querySelectorAll('.lgs').forEach(x=>x.onclick=()=>{d.querySelectorAll('.lgs').forEach(y=>y.classList.toggle('on',y===x));});
  b.onclick=async()=>{const sp=d.querySelector('.lgs.on');const du=Math.round(parseFloat(d.querySelector('#logDur').value));
    const ds=parseFloat(String(d.querySelector('#logDist').value).replace(',','.'));const sel=d.querySelector('.effsel[data-for="log"] .effs.on');
    if(!sp){toast('Wybierz rodzaj treningu.');return;}if(!(du>=5&&du<=720)){toast('Podaj czas od 5 do 720 minut.');return;}
    if(d.querySelector('#logDist').value.trim()&&!(ds>0&&ds<=500)){toast('Dystans: od 0,1 do 500 km.');return;}
    const item={day,sport:sp.dataset.sp,dur:du,desc:d.querySelector('#logNote').value,done:true,logged:true,effort:sel?+sel.dataset.v:undefined,dist:ds>0?Math.round(ds*100)/100:undefined};
    b.disabled=true;try{await planSave('plan',item);toast('Dodano wykonany trening.');refresh();}catch(e){toast(e.message,6000);b.disabled=false;}};
}

/* ===== Czat zawodnik ↔ trener + powiadomienia o zmianach w planie ===== */
function chatUnread(){if(S.local||!S.chat)return 0;return S.chat.filter(m=>m.role!==S.me.role&&m.ts>(S.chatSeen||0)).length;}
function updateChatBadge(){const b=$('#chatBadge');if(!b)return;const n=chatUnread();b.hidden=!n;b.textContent=n>99?'99+':n;const btn=$('#chatBtn');if(btn)btn.hidden=!S.ready||S.local;}
function setChat(list,seen,fromSync){
  const before=chatUnread(),hadIds=new Set((S.chat||[]).map(m=>m.id));
  S.chat=list||[];if(seen!=null)S.chatSeen=Math.max(S.chatSeen||0,seen);
  const fresh=S.chat.filter(m=>!hadIds.has(m.id)&&m.role!==S.me.role);
  if(S.chatOpen&&fresh.length){markChatSeen();renderChat(true);}
  else if(fromSync&&fresh.length&&chatUnread()>before){const m=fresh[fresh.length-1];toast(`${m.type==='msg'?'Nowa wiadomość':'Zmiana w planie'}: ${String(m.text).slice(0,80)}`,6000);}
  updateChatBadge();
}
function markChatSeen(){S.chatSeen=Date.now();updateChatBadge();if(!S.local)api('chatSeen').catch(()=>{});}
function openChat(){S.chatOpen=true;const d=$('#chatdrw');d.hidden=false;document.body.classList.add('chat-open');renderChat();markChatSeen();setTimeout(()=>$('#chatTxt')?.focus({preventScroll:true}),50);}
function closeChat(){S.chatOpen=false;$('#chatdrw').hidden=true;document.body.classList.remove('chat-open');}
function renderChat(keepInput){
  const d=$('#chatdrw');if(!d||d.hidden)return;const f=S.chatFilter||'all';
  const prev=keepInput?($('#chatTxt')?.value||''):'';

    const sep=day!==lastDay?`<div class="cday">${day.charAt(0).toUpperCase()+day.slice(1)}</div>`:'';lastDay=day;const tm=new Date(m.ts).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
    if(m.type==='event')return sep+`<div class="cev ${m.role}">${icon(m.role==='coach'?'done':'free',14)}<div><b>${who(m.role)}</b> ${esc(m.text)}<time>${tm}</time></div></div>`;
    return sep+`<div class="cmsg ${m.role===S.me.role?'me':'them'} ${m.role}"><div class="cb">${esc(m.text)}</div><time>${m.role===S.me.role?'':who(m.role)+', '}${tm}</time></div>`;}).join('');
  d.innerHTML=`<div class="ch-h"><div><h2>Wiadomości</h2><span class="muted">${S.me.role==='coach'?'z zawodnikiem':'z trenerem'} i zmiany w planie</span></div><button class="icon-btn" onclick="closeChat()" aria-label="Zamknij">✕</button></div>
    <div class="ch-tools"><div class="ch-f seg">${[['all','Wszystko'],['msg','Wiadomości'],['event','Zmiany w planie']].map(([k,l])=>`<button data-cf="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>
      ${(S.chat||[]).length?`<button class="btn ghost chclr" id="chClr" aria-haspopup="true">Wyczyść</button>`:''}</div>
    <div class="chclrbox" id="chClrBox" hidden><span>Wyczyścić komunikaty w <b>Twoim</b> widoku? ${S.me.role==='coach'?'Zawodnik':'Trener'} nadal będzie je widział.</span>
      <div class="pact"><button class="btn" data-clr="events">Tylko zmiany w planie</button><button class="btn danger-btn" data-clr="all">Wszystkie komunikaty</button><button class="btn ghost" id="chClrNo">Anuluj</button></div></div>
    <div class="ch-list" id="chList">${rows||`<p class="muted ch-empty">${f==='event'?'Brak zmian w planie.':'Brak wiadomości. Napisz pierwszą.'}</p>`}</div>

  const ta=$('#chatTxt');ta.value=prev;
  d.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{S.chatFilter=b.dataset.cf;renderChat(true);});

  const cn=$('#chClrNo');if(cn)cn.onclick=()=>{$('#chClrBox').hidden=true;const c=$('#chClr');if(c)c.hidden=false;};

    S.chat=(S.chat||[]).filter(m=>what==='events'?m.type!=='event':false);S.chatSeen=now;renderChat(true);updateChatBadge();
    toast(what==='events'?'Wyczyszczono zmiany w planie.':'Wyczyszczono komunikaty.');

  const send=async()=>{const t=ta.value.trim();if(!t)return;const b=$('#chatSend');b.disabled=true;
    try{const m=S.local?{id:'m'+Date.now(),role:S.me.role,type:'msg',text:t,ts:Date.now()}:await api('chatSend',{text:t});S.chat=(S.chat||[]).concat([m]);ta.value='';S.chatFilter=S.chatFilter==='event'?'all':S.chatFilter;renderChat();}
    catch(e){toast('Nie wysłano: '+e.message);b.disabled=false;}};

}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.chatOpen&&!document.querySelector('dialog[open]'))closeChat();});

/* ===== Ocena treningu przez trenera (1–5) ===== */
const RATE=[null,['Słabo','#E0393E'],['Poniżej oczekiwań','#F08C00'],['Przeciętnie','#E8B923'],['Dobrze','#74B816'],['Bardzo dobrze','#2F9E44']];
const ratingOf=a=>(S.ratings||{})[a.id]?.r||null;
function rateBadge(a){const r=ratingOf(a);return r?`<span class="badge rate" style="background:${RATE[r][1]}" title="Ocena trenera: ${r} – ${RATE[r][0]}">★ ${r}</span>`:'';}
function ratingWidget(a){
  const r=ratingOf(a);
  if(S.local)return '';
  if(S.me.role==='coach')return `<div class="rating" role="radiogroup" aria-label="Ocena treningu"><span class="rl2">Oceń trening:</span>${[1,2,3,4,5].map(n=>`<button class="rb${r===n?' on':''}" data-r="${n}" role="radio" aria-checked="${r===n}" style="--rc:${RATE[n][1]}" title="${n} – ${RATE[n][0]}">${n}</button>`).join('')}<span class="rtxt">${r?`${RATE[r][0]}`:'1 – słabo, 5 – bardzo dobrze'}</span></div>`;
  return `<div class="rating ro"><span class="rl2">Ocena trenera:</span>${r?`<span class="stars" aria-label="${r} na 5">${'★'.repeat(r)}<i>${'★'.repeat(5-r)}</i></span><b style="color:${RATE[r][1]}">${r} – ${RATE[r][0]}</b>`:'<span class="muted">jeszcze nie oceniono</span>'}</div>`;
}
function bindRating(a){
  document.querySelectorAll('.rating .rb').forEach(b=>b.onclick=async()=>{
    const n=+b.dataset.r;const cur=ratingOf(a);const val=cur===n?null:n;
    try{await api('rate',{id:a.id,r:val});S.ratings=S.ratings||{};if(val)S.ratings[a.id]={r:val,ts:Date.now()};else delete S.ratings[a.id];
      const w=document.querySelector('.rating');if(w){w.outerHTML=ratingWidget(a);bindRating(a);}toast(val?`Oceniono: ${val} – ${RATE[val][0]}`:'Usunięto ocenę.');}
    catch(e){toast('Nie zapisano oceny: '+e.message);}
  });
}
function ratingSummary(acts,prevActs){
  const rated=acts.filter(ratingOf);if(!acts.length)return'';
  const avg=rated.length?rated.reduce((s,a)=>s+ratingOf(a),0)/rated.length:null;
  const pr=prevActs.filter(ratingOf);const pavg=pr.length?pr.reduce((s,a)=>s+ratingOf(a),0)/pr.length:null;
  const dist=[1,2,3,4,5].map(n=>rated.filter(a=>ratingOf(a)===n).length);const mx=Math.max(1,...dist);
  const byCat={};for(const a of rated){const k=catOf(a);(byCat[k]||(byCat[k]=[])).push(ratingOf(a));}
  const verdict=avg==null?'':avg>=4.5?'Bardzo dobry miesiąc':avg>=3.5?'Dobry miesiąc':avg>=2.5?'Przeciętny miesiąc':avg>=1.5?'Miesiąc poniżej oczekiwań':'Słaby miesiąc';
  const best=[...rated].sort((x,y)=>ratingOf(y)-ratingOf(x)||y.start-x.start).filter(a=>ratingOf(a)>=4).slice(0,3);
  const worst=[...rated].sort((x,y)=>ratingOf(x)-ratingOf(y)||y.start-x.start).filter(a=>ratingOf(a)<=2).slice(0,3);
  const li=a=>`<li><a href="#/a/${encodeURIComponent(a.id)}">${esc(a.name)}</a> <span class="muted">${new Date(a.start).toLocaleDateString('pl-PL',{day:'numeric',month:'short'})}</span> ${rateBadge(a)}</li>`;
  return `<section class="sec"><div class="sec-h"><h2>Ocena treningów w miesiącu</h2><span class="muted">oceny trenera w skali 1–5</span></div>
  ${rated.length?`<div class="rsum">
    <div class="rbig"><b class="num" style="color:${RATE[Math.round(avg)][1]}">${nf(avg,1)}</b><span>średnia ocena</span><strong>${verdict}</strong>
      <span class="muted">ocenione ${rated.length} z ${acts.length} ${plural(acts.length,'treningu','treningów','treningów')}</span>
      ${pavg!=null?`<span class="${avg>=pavg?'up':'down'}">${avg>pavg?'▲':avg<pavg?'▼':'='} ${avg===pavg?'tak samo jak':(avg>pavg?'lepiej niż':'gorzej niż')} w poprzednim miesiącu (${nf(pavg,1)})</span>`:''}</div>
    <div class="rdist">${[5,4,3,2,1].map(n=>`<div class="rrow"><span>${n} – ${RATE[n][0]}</span><div class="zb"><i style="width:${dist[n-1]/mx*100}%;background:${RATE[n][1]}"></i></div><b>${dist[n-1]}</b></div>`).join('')}</div>
    <div class="rcat">${Object.entries(byCat).map(([k,v])=>`<div><span><span class="dot" style="background:${CATS[k][1]}"></span>${CATS[k][0]}</span><b>${nf(v.reduce((x,y)=>x+y,0)/v.length,1)}</b><span class="muted">${v.length} ${plural(v.length,'ocena','oceny','ocen')}</span></div>`).join('')}</div>
  </div>
  ${best.length||worst.length?`<div class="grid2 rlists">${best.length?`<div><h3>Najlepiej ocenione</h3><ul>${best.map(li).join('')}</ul></div>`:'<div></div>'}${worst.length?`<div><h3>Do poprawy</h3><ul>${worst.map(li).join('')}</ul></div>`:''}</div>`:''}`
  :`<div class="panel"><p class="muted" style="margin:0">${S.me.role==='coach'?'Nie oceniłeś jeszcze żadnego treningu z tego miesiąca. Oceny dodasz w widoku treningu (1 – słabo, 5 – bardzo dobrze).':'Trener nie ocenił jeszcze treningów z tego miesiąca.'}</p></div>`}
  </section>`;
}

/* ===== Kalendarz zbiorczy ===== */
const MONTHS=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const CATS={run:['Bieg','var(--accent)'],ride:['Rower','var(--spd)'],trainer:['Trenażer rowerowy','#0891B2'],swim:['Pływanie','var(--dyn)'],walk:['Marsz','#8D6E63'],gym:['Siłownia','var(--pw)'],sauna:['Sauna','#D97706'],test:['Test wydolnościowy','#DB2777'],other:['Inne','var(--muted)']};
const KIND_ORDER=Object.keys(CATS);
/** Rodzaj treningu jak w planie: bieg, rower, trenażer, basen, marsz, siłownia, sauna, test, inne */
function kindOf(a){if(a.manual)return CATS[a.kind]?a.kind:'other';if(a.sport===11||a.sport===17)return 'walk';if(a.cat==='ride')return a.indoor?'trainer':'ride';if(a.cat==='run')return 'run';if(a.cat==='swim')return 'swim';if(a.cat==='gym')return 'gym';return 'other';}
const catOf=a=>kindOf(a);
/** Treningi wykonane z planu bez pliku z zegarka (np. sauna, test, siłownia bez zegarka) */
function manualDone(){
  return (S.plan||[]).filter(p=>p.kind==='plan'&&!p.skip&&(p.done||p.change)).map(p=>{
    const k=p.change&&p.change.sport?p.change.sport:p.sport;const du=(p.change&&p.change.dur)||p.dur;
    if(actsOn(p.day).some(a=>sameCat(k,a)))return null; // jest wgrany plik – nie dubluj
    return {manual:true,id:'plan:'+p.id,p,kind:k,day:p.day,start:new Date(p.day+'T12:00').getTime(),name:(PLAN_SPORTS[k]||PLAN_SPORTS.other)[0],effort:planEffort(p),s:{mt:du*60,et:du*60,d:(p.dist||0)*1000,gain:0,cal:0}};
  }).filter(Boolean);
}
function addHist(acc,h){if(!h)return acc;const o=h.o||0;h.s.forEach((v,i)=>{acc[o+i]=(acc[o+i]||0)+v;});return acc;}
function renderCalendar(ym){
  const main=$('#main');const now=new Date();
  let [y,m]=(ym||'').split('-').map(Number);if(!y||!m){y=now.getFullYear();m=now.getMonth()+1;}
  const start=new Date(y,m-1,1),end=new Date(y,m,1);
  const all=[...S.acts.values()].concat(manualDone());
  const acts=all.filter(a=>a.start>=start.getTime()&&a.start<end.getTime()).sort((a,b)=>a.start-b.start);
  const sum=(arr,f)=>arr.reduce((x,a)=>x+(f(a)||0),0);
  const st=S.settings;
  // podział na rodzaje
  const byCat={};for(const a of acts){const k=catOf(a);(byCat[k]||(byCat[k]=[])).push(a);}
  // strefy
  const runs=byCat.run||[];
  const zr=zonesFor('run','hr'),zb=zonesFor('ride','hr');
  const hrRun=acts.filter(a=>zcat(a.cat)==='run'&&a.hrHist),hrRide=acts.filter(a=>zcat(a.cat)==='ride'&&a.hrHist);
  const hrRunT=hrRun.reduce((x,a)=>sumArr(x,histZoneTimes(a.hrHist,1,zr)),zr.map(()=>0));
  const hrRideT=hrRide.reduce((x,a)=>sumArr(x,histZoneTimes(a.hrHist,1,zb)),zb.map(()=>0));
  const zp=zonesFor('run','pace');const pRuns=runs.filter(a=>a.paceHist);
  const paceZ=pRuns.length?pRuns.reduce((x,a)=>sumArr(x,histZoneTimes(a.paceHist,a.paceHist.w,zp)),zp.map(()=>0)):null;
  const zw=zonesFor('ride','pw');const rides=(byCat.ride||[]).filter(a=>a.pwHist&&a.s.pw>0);
  const pwZ=rides.length?rides.reduce((x,a)=>sumArr(x,histZoneTimes({o:0,s:a.pwHist.s},a.pwHist.w,zw)),zw.map(()=>0)):null;
  const nonRun=hrRun.some(a=>a.cat!=='run');
  const runCadT=runs.filter(a=>a.s.cad).reduce((x,a)=>x+a.s.mt,0);
  const runCad=runCadT?runs.filter(a=>a.s.cad).reduce((x,a)=>x+a.s.cad*cadMul(a)*a.s.mt,0)/runCadT:null;
  const hrT=acts.filter(a=>a.s.hr).reduce((x,a)=>x+a.s.mt,0);const hrAvg=hrT?acts.filter(a=>a.s.hr).reduce((x,a)=>x+a.s.hr*a.s.mt,0)/hrT:null;
  const days=new Set(acts.map(a=>new Date(a.start).getDate())).size;
  // siatka
  const first=(start.getDay()+6)%7;const nd=new Date(y,m,0).getDate();const cells=[];
  for(let i=0;i<first;i++)cells.push(null);for(let d=1;d<=nd;d++)cells.push(d);while(cells.length%7)cells.push(null);
  const perDay={};for(const a of acts){const d=new Date(a.start).getDate();(perDay[d]||(perDay[d]=[])).push(a);}
  const isToday=d=>d&&y===now.getFullYear()&&m===now.getMonth()+1&&d===now.getDate();
  const weeks=[];for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));
  const prev=m===1?`${y-1}-12`:`${y}-${m-1}`,next=m===12?`${y+1}-1`:`${y}-${m+1}`;
  // 12 miesięcy
  const months=[];for(let k=11;k>=0;k--){const d=new Date(y,m-1-k,1),e=new Date(y,m-k,1);const arr=all.filter(a=>a.start>=d.getTime()&&a.start<e.getTime());months.push({y:d.getFullYear(),m:d.getMonth()+1,t:sum(arr,a=>a.s.mt),n:arr.length,km:sum(arr,a=>a.s.d)/1000});}
  const mx=Math.max(1,...months.map(x=>x.t));
  const firstA=all.length?Math.min(...all.map(a=>a.start)):Date.now();const f0=new Date(firstA);const monthsAll=[];
  for(let d=new Date(f0.getFullYear(),f0.getMonth(),1);d<=new Date(now.getFullYear(),now.getMonth(),1);d=new Date(d.getFullYear(),d.getMonth()+1,1)){const e=new Date(d.getFullYear(),d.getMonth()+1,1);const arr=all.filter(a=>a.start>=d.getTime()&&a.start<e.getTime());monthsAll.push({y:d.getFullYear(),m:d.getMonth()+1,t:sum(arr,a=>a.s.mt)/3600,n:arr.length,km:sum(arr,a=>a.s.d)/1000});}
  const mxAll=Math.max(1,...monthsAll.map(x=>x.t));
  const dk=d=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const future=d=>new Date(y,m-1,d).getTime()>Date.now();
  const restCell=d=>{const v=S.rest[dk(d)];if(v!=null)return isOwner()?`<button class="rhr" data-day="${dk(d)}" title="Tętno spoczynkowe – kliknij, aby zmienić">♥ ${v}</button>`:`<span class="rhr">♥ ${v}</span>`;
    return isOwner()&&!future(d)?`<button class="rhr add" data-day="${dk(d)}" title="Dodaj tętno spoczynkowe">♥ +</button>`:'';};
  const mRest=Object.entries(S.rest).filter(([k])=>k.startsWith(`${y}-${String(m).padStart(2,'0')}-`)).map(x=>x[1]);
  const mRestAvg=mRest.length?mRest.reduce((a,b)=>a+b,0)/mRest.length:null;
  const chip=a=>`<a class="cal-a${a.manual?' man':''}" href="${a.manual?'#/dyspozycja':'#/a/'+encodeURIComponent(a.id)}"${a.manual?` data-manday="${a.day}"`:''} style="--c:${CATS[catOf(a)][1]}" title="${esc(a.name)}">${icon(catIcon(a),12)}<b>${esc(({trainer:'Trenażer',test:'Test'})[catOf(a)]||CATS[catOf(a)][0])}</b> ${a.s.d>50?km(a.s.d,1)+' km':dur(a.s.mt||a.s.et,true)}</a>`;
  const zoneTable2=(cat,type,times,title)=>times.reduce((x,v)=>x+v,0)?zoneBlockFor(cat,type,times,title):'';
  main.innerHTML=`<div class="wrap home cal">
    <div class="cal-h"><h1>${MONTHS[m-1].charAt(0).toUpperCase()+MONTHS[m-1].slice(1)} ${y}</h1>
      <div class="cal-nav"><a class="btn" href="#/kalendarz/${prev}" aria-label="Poprzedni miesiąc">‹</a><a class="btn" href="#/kalendarz/${now.getFullYear()}-${now.getMonth()+1}">Bieżący</a><a class="btn" href="#/kalendarz/${next}" aria-label="Następny miesiąc">›</a></div></div>
    <div class="tbl-wrap cal-grid-wrap"><table class="cal-grid"><thead><tr>${['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(d=>`<th>${d}</th>`).join('')}<th>Suma</th></tr></thead><tbody>
      ${weeks.map(w=>{const wa=w.flatMap(d=>d?perDay[d]||[]:[]);return `<tr>${w.map(d=>`<td class="${d?'':'out'}${isToday(d)?' today':''}">${d?`<span class="dn">${d}${restCell(d)}</span>${(perDay[d]||[]).map(chip).join('')}`:''}</td>`).join('')}
        <td class="wk">${wa.length?`<b>${dur(sum(wa,a=>a.s.mt),true)}</b><span>${km(sum(wa,a=>a.s.d),1)} km</span><span>${wa.length} ${plural(wa.length,'trening','treningi','treningów')}</span>`:'<span>—</span>'}</td></tr>`;}).join('')}
    </tbody></table></div>
    <section class="sec"><div class="sec-h"><h2>Podsumowanie miesiąca</h2></div>
    <section class="cal-stats">
      <div><b class="num">${acts.length}</b><span>${plural(acts.length,'trening','treningi','treningów')} w ${days} ${days===1?'dniu':'dniach'}</span></div>
      <div><b class="num">${dur(sum(acts,a=>a.s.mt),true)}</b><span>czas ruchu</span></div>
      <div><b class="num">${km(sum(acts,a=>a.s.d),1)}</b><span>km</span></div>
      <div><b class="num">${nf(sum(acts,a=>a.s.gain))}</b><span>m w górę</span></div>
      <div><b class="num">${nf(sum(acts,a=>a.s.cal))}</b><span>kcal</span></div>
      <div><b class="num">${nf(sum(acts,a=>loadOf(a)?.v))}</b><span>obciążenie</span></div>
      ${hrAvg?`<div><b class="num">${nf(hrAvg)}</b><span>śr. tętno (bpm)</span></div>`:''}
      ${runCad?`<div><b class="num">${nf(runCad)}</b><span>śr. kadencja biegu</span></div>`:''}
    </section>
    </section>
    ${ratingSummary(acts,all.filter(a=>a.start>=new Date(y,m-2,1).getTime()&&a.start<start.getTime()))}
    ${acts.length?`<section class="sec"><div class="sec-h"><h2>Rodzaje treningów</h2></div><div class="tbl-wrap"><table><thead><tr><th>Rodzaj</th><th>Liczba</th><th>Czas</th><th>Dystans</th><th>Śr. tempo / prędkość</th><th>W górę</th><th>Tętno śr.</th><th>Kalorie</th><th>Obciążenie</th></tr></thead><tbody>
      ${Object.entries(byCat).map(([k,arr])=>{const d=sum(arr,a=>a.s.d),t=sum(arr,a=>a.s.mt);const ht=arr.filter(a=>a.s.hr).reduce((x,a)=>x+a.s.mt,0);const h=ht?arr.filter(a=>a.s.hr).reduce((x,a)=>x+a.s.hr*a.s.mt,0)/ht:null;
        return `<tr><td><span class="dot" style="background:${CATS[k][1]}"></span>${CATS[k][0]}</td><td>${arr.length}</td><td>${dur(t,true)}</td><td>${km(d,1)} km</td><td>${d>50&&t?(k==='run'?pace(d/t)+' /km':nf(d/t*3.6,1)+' km/h'):'–'}</td><td>${nf(sum(arr,a=>a.s.gain))} m</td><td>${h?nf(h)+' bpm':'–'}</td><td>${nf(sum(arr,a=>a.s.cal))}</td><td>${nf(sum(arr,a=>loadOf(a)?.v))}</td></tr>`;}).join('')}
      </tbody></table></div></section>
    <div class="grid2">
      ${hrRun.length?zoneTable2('run','hr',hrRunT,nonRun?'Tętno – bieg i pozostałe':'Tętno – bieg'):''}
      ${hrRide.length?zoneTable2('ride','hr',hrRideT,'Tętno – rower'):''}
      ${paceZ?zoneTable2('run','pace',paceZ,'Tempo – bieg'):''}
      ${pwZ?zoneTable2('ride','pw',pwZ,'Moc – rower'):''}
    </div>
    ${runs.length&&runs.some(a=>!a.paceHist)?'<p class="note">Strefy tempa obejmują tylko biegi wgrane po dodaniu tej funkcji.</p>':''}`
    :`<div class="empty" style="margin-top:20px"><h2>Brak treningów w tym miesiącu</h2><p>Wybierz inny miesiąc strzałkami lub z wykresu powyżej.</p></div>`}
    <section class="sec"><div class="sec-h"><h2>Cały okres</h2><span class="muted">czas ruchu w kolejnych miesiącach – kliknij, aby przejść</span></div>
    <div class="months allm">${monthsAll.map(x=>`<a href="#/kalendarz/${x.y}-${x.m}" class="mb${x.y===y&&x.m===m?' on':''}" title="${x.n} ${plural(x.n,'trening','treningi','treningów')}, ${nf(x.km,0)} km, ${dur(x.t*3600,true)}"><b>${x.n||''}</b><i style="height:${Math.max(2,x.t/mxAll*54)}px"></i><span>${MONTHS[x.m-1].slice(0,3)}${x.m===1||x===monthsAll[0]?' '+String(x.y).slice(2):''}</span></a>`).join('')}</div></section>
  </div>`;
  main.querySelectorAll('button.rhr').forEach(b=>b.onclick=e=>{e.preventDefault();editRest(b.dataset.day);});
  main.querySelectorAll('[data-manday]').forEach(el=>el.onclick=e=>{e.preventDefault();e.stopPropagation();const d=el.dataset.manday;DISP_MEM.v='week';go('#/dyspozycja/t/'+ymd(mondayOf(new Date(d+'T12:00'))));openDay(d);});
  S.redraw=null;
}

function importBar(){
  const ii=S.importInfo;if(!isOwner()||!ii||!ii.folder)return'';
  const l=ii.last;
  return `<div class="impbar"><span class="muted">${ii.auto?'Import z Dysku codziennie ok. 21:00':'Import z Dysku wyłączony'}${l?`, ostatni ${ago(l.at)}: dodano ${l.ok}`:''}</span>
    <a class="btn ghost" href="${esc(ii.folder)}" target="_blank" rel="noopener">Folder importu</a><button class="btn" id="impNow" onclick="importNow(this)">Importuj teraz</button></div>`;
}
async function importNow(btn){
  btn.disabled=true;toast('Sprawdzam folder na Dysku… To może potrwać do kilku minut.',300000);
  try{const r=await api('importNow');
    const msg=[`Dodano: ${r.ok}`];if(r.dup)msg.push(`duplikaty: ${r.dup}`);if(r.err.length)msg.push(`błędy: ${r.err.join('; ')}`);if(r.left)msg.push(`pozostało do następnego importu: ${r.left}`);
    toast(msg.join(', '),r.err.length?10000:4000);S.importInfo.last={at:Date.now(),ok:r.ok};
    if(r.ok)applyInitSoft(await api('init'));else render();
  }catch(e){toast('Import nie powiódł się: '+e.message,8000);btn.disabled=false;}
}

/* ===== Ustawienia ===== */
function openSettings(){
  if(!S.ready)return;
  const d=$('#setdlg');const st=S.settings;const own=isOwner();const dn=st.deviceNames||{};
  const devs=[...new Map([...S.acts.values()].map(a=>[a.device.key,a.device.name])).entries()];
  d.innerHTML=`<div class="dlg-h"><h2>Ustawienia zawodnika</h2><button class="icon-btn" onclick="this.closest('dialog').close()" aria-label="Zamknij">✕</button></div>
  <div class="dlg-b"><p class="help" style="margin:0">${own?'Te wartości wyznaczają strefy i obciążenie treningowe. Zmiana przelicza wszystkie aktywności od razu.':'Wartości ustawione przez zawodnika — możesz je tylko podejrzeć.'}</p>
  <div class="fields">
    <label class="f">FTP – moc progowa (W)<input type="number" id="s_ftp" min="50" max="600" value="${st.ftp}" ${own?'':'disabled'}></label>
    <label class="f">Masa ciała (kg)<input type="number" id="s_weight" min="30" max="200" step="0.1" value="${st.weight}" ${own?'':'disabled'}></label>
    <label class="f">Tętno maksymalne<input type="number" id="s_maxHr" min="120" max="230" value="${st.maxHr}" ${own?'':'disabled'}></label>
    <label class="f">Tętno spoczynkowe<input type="number" id="s_restHr" min="30" max="100" value="${st.restHr}" ${own?'':'disabled'}></label>
    <label class="f">Tętno progowe (LTHR)<input type="number" id="s_lthr" min="100" max="220" value="${st.lthr}" ${own?'':'disabled'}></label>
    <label class="f">Tempo progowe (min:s /km)<input id="s_thrPace" placeholder="4:45" value="${dur(st.thrPace||285)}" ${own?'':'disabled'}></label>
  </div>
  ${zoneEditor(own)}
  ${devs.length?`<div><h3 style="font-size:19px;margin:4px 0 8px">Nazwy urządzeń</h3><div class="fields">${devs.map(([k,n],i)=>`<label class="f">${esc(n)}<input data-dev="${esc(k)}" maxlength="40" placeholder="np. Suunto 9 lub iGPSPORT BSC200" value="${esc(dn[k]||'')}" ${own?'':'disabled'}></label>`).join('')}</div></div>`:''}
  ${own&&S.coachLink?`<div class="help"><b>Link dla trenera.</b> Wyślij go trenerowi — po otwarciu zobaczy wszystkie treningi i będzie mógł dodawać uwagi, ale nie wgra ani nie usunie aktywności. Link zawiera kod dostępu, więc nie udostępniaj go nikomu innemu.
    <div style="display:flex;gap:8px;margin-top:8px"><input readonly id="coachLink" value="${esc(S.coachLink)}" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--surface);color:var(--ink)"><button class="btn" id="copyLink">Kopiuj</button></div></div>`:''}
  </div>
  <div class="dlg-f">${own||!S.local?`<button class="btn ghost" id="s_logout" style="margin-right:auto">Wyloguj</button>`:''}<button class="btn" onclick="this.closest('dialog').close()">${own?'Anuluj':'Zamknij'}</button>${own?'<button class="btn primary" id="s_save">Zapisz ustawienia</button>':''}</div>`;
  d.showModal();bindZoneEditor(d);
  const cp=$('#copyLink');if(cp)cp.onclick=()=>{const i=$('#coachLink');i.select();try{navigator.clipboard.writeText(i.value).then(()=>toast('Skopiowano link.'),()=>{document.execCommand('copy');toast('Skopiowano link.');});}catch(e){document.execCommand('copy');toast('Skopiowano link.');}};
  const lo=$('#s_logout');if(lo)lo.onclick=()=>{cacheClear();try{localStorage.removeItem('dt_key');}catch(e){}d.close();S.key='';showLogin();};
  const sv=$('#s_save');if(sv)sv.onclick=async()=>{
    const v={};for(const k of ['ftp','weight','maxHr','restHr','lthr']){const x=parseFloat($('#s_'+k).value);if(!isFinite(x)){toast('Uzupełnij wszystkie pola.');return;}v[k]=x;}
    if(v.restHr>=v.maxHr){toast('Tętno spoczynkowe musi być niższe od maksymalnego.');return;}
    const pm=$('#s_thrPace').value.trim().match(/^(\d{1,2})[:.,](\d{2})$/);if(!pm||+pm[2]>59){toast('Tempo progowe wpisz jako min:s, np. 4:45.');return;}v.thrPace=+pm[1]*60+ +pm[2];
    try{v.zones=readZoneEditor(d);}catch(e){toast(e.message,6000);return;}
    const names={};d.querySelectorAll('[data-dev]').forEach(i=>{if(i.value.trim())names[i.dataset.dev]=i.value.trim().slice(0,40);});v.deviceNames=names;
    const next={...S.settings,...v};
    if(!S.local){try{await api('saveSettings',{settings:next});}catch(e){toast('Nie zapisano: '+e.message);return;}}
    S.settings=next;d.close();toast('Zapisano ustawienia.');render();
  };
}

boot();
</script></body></html>
