<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7FA;--surface:#FFFFFF;--surface-2:#F0F0F5;--ink:#242428;--muted:#6D6D78;--line:#DFDFE8;
  --accent:#FC4C02;--accent-ink:#FFFFFF;--accent-soft:#FFE9DF;--ok:#2F9E44;--ok-soft:#E3F4E6;--coach-bg:#E3EFFC;--coach-bd:#4C8FE0;
  --hr:#E0393E;--pw:#7E57C2;--spd:#3D9BE9;--alt:#A9A9B4;--cad:#9C27B0;--tmp:#F5A623;--dyn:#00A3A3;--xf:#5C6BC0;
  --warn:#F5A623;--danger:#D32F2F;
  --topo:rgba(36,36,40,.06);--shadow:0 1px 3px rgba(36,36,40,.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1B1F;--surface:#25252B;--surface-2:#2E2E35;--ink:#EDEDF0;--muted:#A1A1AB;--line:#3A3A43;
  --accent:#FC5200;--accent-ink:#FFFFFF;--accent-soft:#4A2414;--ok:#51CF66;--ok-soft:#183A20;--coach-bg:#17304A;--coach-bd:#5CA0F0;
  --hr:#FF5C61;--pw:#A98BEA;--spd:#5CB0F2;--alt:#7C7C88;--cad:#CE6BE0;--tmp:#F7B84B;--dyn:#33C2C2;--xf:#8E99E0;
  --warn:#F7B84B;--danger:#FF6B5B;--topo:rgba(237,237,240,.05);--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1B1B1F;--surface:#25252B;--surface-2:#2E2E35;--ink:#EDEDF0;--muted:#A1A1AB;--line:#3A3A43;
  --accent:#FC5200;--accent-ink:#FFFFFF;--accent-soft:#4A2414;--ok:#51CF66;--ok-soft:#183A20;--coach-bg:#17304A;--coach-bd:#5CA0F0;
  --hr:#FF5C61;--pw:#A98BEA;--spd:#5CB0F2;--alt:#7C7C88;--cad:#CE6BE0;--tmp:#F7B84B;--dyn:#33C2C2;--xf:#8E99E0;
  --warn:#F7B84B;--danger:#FF6B5B;--topo:rgba(237,237,240,.05);--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{letter-spacing:-.01em;font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;letter-spacing:.005em;margin:0;line-height:1.1}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
.num{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.wrap{max-width:1260px;margin:0 auto;padding:0 20px}

/* nagłówek */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font:600 22px/1 "Inter",sans-serif;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);white-space:nowrap}
.who img{width:26px;height:26px;border-radius:50%}
.role{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.banner{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:14px;padding:8px 0;color:var(--muted)}

/* lista */
.home{display:grid;gap:28px;padding:26px 0 60px}
.overview{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.panel h2{font-size:22px;margin-bottom:4px}
.panel .sub{font-size:13px;color:var(--muted);margin:0 0 12px}
.form-vals{display:flex;gap:26px;margin:4px 0 10px;flex-wrap:wrap}
.form-vals div{display:grid}
.form-vals .num{font-size:30px;line-height:1}
.form-vals span{font-size:13px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.week-now{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px;margin:6px 0 14px}
.week-now .num{font-size:28px;line-height:1.05;display:block}
.week-now span{font-size:13px;color:var(--muted)}
.cv{display:block;width:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week{margin-top:22px}
.week-h{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:0 4px 8px;border-bottom:1px solid var(--line)}
.week-h h3{font-size:19px}
.week-h .tot{font-size:14px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.acts{list-style:none;margin:0;padding:0}
.act{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:16px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.act:hover{background:var(--surface)}
.act .day{text-align:center;line-height:1.05}
.act .day b{display:block;font:600 26px/1 "Inter",sans-serif}
.act .day span{font-size:12px;color:var(--muted)}
.act .t{min-width:0}
.act .t b{font-weight:600;font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .t span{font-size:13px;color:var(--muted)}
.act .m{display:flex;gap:22px;text-align:right}
.act .m div{display:grid;min-width:58px}
.act .m .num{font-size:20px;line-height:1.1}
.act .m span{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.badge.new{background:var(--accent);color:var(--accent-ink)}
.badge.cmc{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:60px 20px;border:2px dashed var(--line);border-radius:14px;background:var(--surface)}
.empty h2{font-size:30px;margin-bottom:8px}
.empty p{max-width:52ch;margin:0 auto 18px;color:var(--muted)}
.drop-on .empty,.drop-on .dropzone{border-color:var(--accent);background:var(--accent-soft)}

/* aktywność */
.actv{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:26px;padding:20px 0 70px;align-items:start}
.back{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);text-decoration:none;margin-bottom:10px}
.back:hover{color:var(--ink)}
.ah{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.ah h1{font-size:clamp(30px,4vw,44px)}
.ah h1[contenteditable="true"]{outline:none;border-bottom:1px dashed var(--line);cursor:text}
.ah h1[contenteditable="true"]:focus{border-bottom-color:var(--accent)}
.ah .meta{color:var(--muted);font-size:14px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.dev{display:inline-flex;align-items:center;gap:6px}
.dev::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dev,var(--muted))}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbox{position:relative;min-height:340px;border-right:1px solid var(--line);
  background-color:var(--surface-2);
  background-image:repeating-radial-gradient(circle at 30% 40%,transparent 0 22px,var(--topo) 22px 23px),repeating-radial-gradient(circle at 78% 70%,transparent 0 30px,var(--topo) 30px 31px)}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%}
.mapbox .ov{pointer-events:none}
.map-ctl{position:absolute;left:12px;top:12px;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;z-index:2}
.map-ctl button{border:0;background:transparent;border-radius:6px;padding:4px 9px;font-size:13px;cursor:pointer;color:var(--muted)}
.map-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.map-leg{position:absolute;left:12px;bottom:12px;right:12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);z-index:2;pointer-events:none}
.map-leg .ramp{height:6px;flex:0 1 160px;border-radius:3px;background:linear-gradient(90deg,#3B82C4,#F2C230,#D9342B)}
.map-leg span{background:var(--surface);padding:1px 6px;border-radius:4px}
.nomap{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px}
.nomap b{display:block;font:600 24px/1.1 "Inter",sans-serif;color:var(--ink);margin-bottom:4px}
.stats{padding:20px 22px;display:grid;align-content:start;gap:18px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big3 .num{font-size:clamp(28px,3.2vw,40px);line-height:1;display:block}
.big3 span,.minis span{font-size:13px;color:var(--muted)}
.minis{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--line)}
.minis div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.minis div:nth-child(odd){padding-right:14px}
.minis div:nth-child(even){padding-left:14px;border-left:1px solid var(--line)}
.minis b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:25px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.charts{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px 6px;touch-action:pan-y}
.cp{position:relative}
.cp+.cp{border-top:1px solid var(--line)}
.cp-h{display:flex;justify-content:space-between;font-size:13px;padding:6px 4px 0 44px}
.cp-l{font-weight:600;color:var(--c)}
.cp-v{font-variant-numeric:tabular-nums;color:var(--muted)}
.cp-v b{color:var(--ink);font-weight:600}
.cp-c{position:relative}
.cp-c canvas{display:block;width:100%}
.cp-c .ov{position:absolute;inset:0;cursor:crosshair}
.selbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:9px 14px;margin:10px 0 0;font-size:14px}
.selbar[hidden]{display:none}
.selbar .vals{display:flex;gap:16px;flex-wrap:wrap;margin-right:auto}
.selbar .vals b{font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-weight:600;font-size:12px;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tr.best td{background:var(--accent-soft)}
tr.rest td{color:var(--muted)}
.bar{position:relative;height:16px;min-width:90px;background:transparent}
.bar i{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--spd);opacity:.75}
.zones{display:grid;gap:7px}
.zone{display:grid;grid-template-columns:150px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:13px}
.zone .zb{height:18px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.zone .zb i{display:block;height:100%;border-radius:4px}
.zone .zv{text-align:right;font-variant-numeric:tabular-nums}
.zone .zn b{display:block;font-weight:600}
.zone .zn span{color:var(--muted);font-size:12px}
.medal{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font:600 12px/1 "Inter",sans-serif;margin-left:6px;vertical-align:1px}
.medal.m1{background:#E8B923;color:#3A2C00}.medal.m2{background:#B8C2CC;color:#1E2A33}.medal.m3{background:#C98A4B;color:#2E1A06}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv div{padding:10px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:8px 2px 0;max-width:80ch}
.desc{margin:0 0 16px;max-width:75ch;white-space:pre-wrap}
.desc-edit{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:9px 11px;resize:vertical}

/* uwagi */
.aside{position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.aside-h{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.aside-h h2{font-size:24px}
.aside-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.thread{flex:1;overflow-y:auto;padding:6px 16px;display:grid;align-content:start;gap:0}
.cm{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cm:last-child{border-bottom:0}
.cm img{width:30px;height:30px;border-radius:50%;background:var(--line)}
.cm .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.cm .h b{font-size:14px}
.cm .h .rl{font-size:11px;font-weight:600;color:var(--accent)}
.cm .h time{color:var(--muted);margin-left:auto}
.cm p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cm.unread{background:linear-gradient(90deg,var(--accent-soft),transparent 70%);margin:0 -16px;padding-left:16px;padding-right:16px}
.anc{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;font-size:12px;padding:1px 9px;margin-top:5px;background:var(--surface-2);cursor:pointer;color:var(--ink)}
.anc::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cm .del{font-size:12px;border:0;background:none;color:var(--muted);cursor:pointer;padding:0;margin-top:4px}
.cm .del:hover{color:var(--danger)}
.compose{border-top:1px solid var(--line);padding:12px 16px 14px;display:grid;gap:8px;background:var(--surface-2)}
.compose textarea{width:100%;min-height:74px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.compose .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.compose .hint{font-size:12px;color:var(--muted)}
.empty-th{padding:22px 0;color:var(--muted);font-size:14px}

/* okna */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));box-shadow:0 20px 60px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,16,20,.45)}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg-h h2{font-size:26px}
.dlg-b{padding:16px 20px;display:grid;gap:14px;max-height:70vh;overflow-y:auto}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);color:var(--ink);font-size:15px}
.help{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100vw - 30px);box-shadow:var(--shadow)}
.toast[hidden]{display:none}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

@media (max-width:1100px){
  .actv{grid-template-columns:minmax(0,1fr)}
  .aside{position:static;max-height:none}
  .thread{max-height:none}
}
@media (max-width:860px){
  .overview,.hero,.grid2{grid-template-columns:minmax(0,1fr)}
  .mapbox{border-right:0;border-bottom:1px solid var(--line);min-height:280px}
}
@media (max-width:620px){
  .wrap{padding:0 12px}
  .brand b{font-size:19px}
  .who .nm{display:none}
  .act{grid-template-columns:44px minmax(0,1fr);gap:10px}
  .act .m{grid-column:2;justify-content:flex-start;text-align:left;gap:16px}
  .fields{grid-template-columns:1fr}
  .minis{grid-template-columns:1fr}
  .minis div:nth-child(even){padding-left:0;border-left:0}
  .minis div:nth-child(odd){padding-right:0}
  .top .btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.main-col{container-type:inline-size;min-width:0}
@container (max-width:1000px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .mapbox{border-right:0;border-bottom:1px solid var(--line);min-height:360px}
}
@container (max-width:520px){
  .minis{grid-template-columns:1fr}
  .minis div:nth-child(even){padding-left:0;border-left:0}
  .minis div:nth-child(odd){padding-right:0}
  .zone{grid-template-columns:110px minmax(0,1fr) 84px}

.chs{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:12px;font-weight:600;padding:7px 4px;cursor:pointer;text-align:center;min-height:56px}
.chs .ic{color:var(--c)}
.chs.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.zsel{display:grid;gap:6px}
.zbtns{display:flex;gap:6px;flex-wrap:wrap}
.zb2{min-width:48px;min-height:40px;border-radius:8px;border:2px solid var(--zc);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.zb2.on{background:var(--zc);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.zchip{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:#F9C8C9;color:#7A1418;margin-left:4px;white-space:nowrap}
.zmini{font-weight:700;color:var(--hr)}
.actli{border-bottom:1px solid var(--accent)}

.aeb:hover{background:color-mix(in srgb,var(--ec) 15%,transparent)}
.aeb.on{background:var(--ec);color:#fff}
.aelbl{margin-left:4px}
.ah .aeff{padding:6px 0 0}
.dsum{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.dsum b{color:var(--ink)}
.disp-grid td.dd>span.dsumm{display:block!important;font-size:10.5px!important;color:var(--muted);padding:0 2px!important;margin:-2px 0 3px!important;background:none!important;border:0!important}

@media (max-width:380px){.aeff{padding-left:4px}.aelbl{display:none}}
.chs,.chs span{overflow-wrap:normal;word-break:normal}.chs{font-size:11.5px;line-height:1.2}

.syncdot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}

  .disp-grid td.dd>span.dsummob{display:block!important;font-size:9.5px!important;line-height:1.2!important;padding:1px 2px!important;margin:0 0 2px!important;background:var(--accent-soft)!important;border:0!important;border-radius:3px;color:var(--ink);text-align:center;white-space:nowrap}
  .disp-grid td.dd>span.dsummob b{color:var(--accent)}

}

/* uwagi i edycja planu */

.wplan .pnote{margin-top:2px;font-size:12px}
.pedbtns{margin-top:6px}.pedbtns .btn{font-size:13px;padding:5px 10px;min-height:34px}
.pedit{display:grid;gap:8px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

/* treningi z planu bez pliku */
.manic{display:inline-flex;vertical-align:-3px;margin-right:4px}
.badge.zplanu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* brak dyspozycji i treningi dodane ręcznie */
.avo.none{border-color:var(--muted);color:var(--muted)}.avo.none.on{background:var(--muted);color:#fff}

.logsec details[open]>*{margin-bottom:8px}

<script>
/* ===== FIT: dekoder binarny ===== */
const FIT_EPOCH = 631065600;
const FIT_TYPES = {0:[1,'u8',0xFF],1:[1,'s8',0x7F],2:[1,'u8',0xFF],3:[2,'s16',0x7FFF],4:[2,'u16',0xFFFF],5:[4,'s32',0x7FFFFFFF],6:[4,'u32',0xFFFFFFFF],7:[1,'str',null],8:[4,'f32',null],9:[8,'f64',null],10:[1,'u8',0],11:[2,'u16',0],12:[4,'u32',0],13:[1,'u8',0xFF],14:[8,'s64',null],15:[8,'u64',null],16:[8,'u64',null]};
function fitReadOne(dv,p,k,le){switch(k){case'u8':return dv.getUint8(p);case's8':return dv.getInt8(p);case'u16':return dv.getUint16(p,le);case's16':return dv.getInt16(p,le);case'u32':return dv.getUint32(p,le);case's32':return dv.getInt32(p,le);case'f32':return dv.getFloat32(p,le);case'f64':return dv.getFloat64(p,le);case's64':return Number(dv.getBigInt64(p,le));case'u64':return Number(dv.getBigUint64(p,le));}return null;}
function fitReadField(dv,p,size,bt,le){
  const t=FIT_TYPES[bt&0x1F]; if(!t) return null;
  const [sz,k,inv]=t;
  if(k==='str'){const b=[];for(let i=0;i<size;i++){const c=dv.getUint8(p+i);if(c===0)break;b.push(c);}return b.length?utf8(b):null;}
  if(size<sz||size%sz) return null;
  const one=i=>{const v=fitReadOne(dv,p+i*sz,k,le);if(inv!==null&&v===inv)return null;if(typeof v==='number'&&!isFinite(v))return null;return v;};
  const n=size/sz; if(n===1) return one(0);
  const a=[];for(let i=0;i<n;i++)a.push(one(i));
  return a.every(v=>v===null)?null:a;
}
function utf8(b){ // dekoder UTF-8 działający też w Google Apps Script (brak TextDecoder)
  if(typeof TextDecoder!=='undefined') return new TextDecoder().decode(new Uint8Array(b));
  let s='',i=0;while(i<b.length){const c=b[i++];if(c<128)s+=String.fromCharCode(c);else if(c<224)s+=String.fromCharCode(((c&31)<<6)|(b[i++]&63));
    else if(c<240)s+=String.fromCharCode(((c&15)<<12)|((b[i++]&63)<<6)|(b[i++]&63));else{const cp=((c&7)<<18)|((b[i++]&63)<<12)|((b[i++]&63)<<6)|(b[i++]&63);s+=String.fromCodePoint(cp);}}
  return s;
}
function parseFit(buf){
  const dv=new DataView(buf), msgs=[], devDesc={}; let pos=0, files=0;
  while(pos+12<=buf.byteLength){
    const hs=dv.getUint8(pos);
    if(hs<12||pos+hs>buf.byteLength) break;
    const sig=String.fromCharCode(dv.getUint8(pos+8),dv.getUint8(pos+9),dv.getUint8(pos+10),dv.getUint8(pos+11));
    if(sig!=='.FIT'){ if(files) break; throw new Error('To nie jest plik FIT.'); }
    const size=dv.getUint32(pos+4,true); let p=pos+hs; const end=Math.min(p+size,buf.byteLength);
    const defs={}; let lastTs=null;
    try{
    while(p<end){
      const h=dv.getUint8(p++); let def, tsOv=null;
      if(h&0x80){
        def=defs[(h>>5)&3]; const off=h&0x1F;
        if(lastTs!=null){let ts=lastTs-(lastTs%32)+off; if(off<lastTs%32) ts+=32; lastTs=ts; tsOv=ts;}
      } else if(h&0x40){
        const lt=h&0x0F, hasDev=h&0x20; p++;
        const le=dv.getUint8(p++)===0; const gmn=dv.getUint16(p,le); p+=2; const nf=dv.getUint8(p++);
        const fields=[]; for(let i=0;i<nf;i++){fields.push([dv.getUint8(p),dv.getUint8(p+1),dv.getUint8(p+2)]);p+=3;}
        const dfs=[]; if(hasDev){const nd=dv.getUint8(p++);for(let i=0;i<nd;i++){dfs.push([dv.getUint8(p),dv.getUint8(p+1),dv.getUint8(p+2)]);p+=3;}}
        defs[lt]={gmn,le,fields,dfs}; continue;
      } else def=defs[h&0x0F];
      if(!def) throw new Error('Uszkodzony plik FIT (brak definicji komunikatu).');
      const f={}; let dev=null;
      for(const [num,sz,bt] of def.fields){ if(p+sz>end){p=end;break;} const v=fitReadField(dv,p,sz,bt,def.le); if(v!==null) f[num]=v; p+=sz; }
      for(const [num,sz,idx] of def.dfs){
        const d=devDesc[idx+':'+num];
        if(d&&p+sz<=end){ let v=fitReadField(dv,p,sz,d.bt,def.le); if(typeof v==='number'){ if(d.scale) v=v/d.scale; if(d.offset) v-=d.offset; (dev||(dev={}))[d.name]={v,u:d.units}; } }
        p+=sz;
      }
      if(f[253]!=null) lastTs=f[253]; else if(tsOv!=null) f[253]=tsOv;
      if(def.gmn===206&&f[1]!=null){ const nm=Array.isArray(f[3])?f[3].join(''):f[3]; devDesc[(f[0]??0)+':'+f[1]]={bt:f[2]??2,name:String(nm||('pole '+f[1])).trim(),units:typeof f[8]==='string'?f[8]:'',scale:typeof f[6]==='number'?f[6]:0,offset:typeof f[7]==='number'?f[7]:0}; }
      msgs.push({g:def.gmn,f,dev});
    }
    }catch(e){ if(!msgs.some(m=>m.g===20)) throw e; /* uszkodzony koniec pliku: zachowaj to, co odczytano */ }
    files++; pos=end+2;
  }
  if(!msgs.length) throw new Error('Plik FIT jest pusty.');
  return msgs;
}

/* ===== Słowniki ===== */
const MANUF={1:'Garmin',23:'Suunto',32:'Wahoo',123:'Polar',255:'Urządzenie deweloperskie',260:'Zwift',267:'Bryton',289:'Hammerhead',294:'Coros'};
const SPORT={0:'Trening',1:'Bieg',2:'Rower',4:'Trening',5:'Pływanie',10:'Trening',11:'Spacer',12:'Narciarstwo biegowe',13:'Narciarstwo zjazdowe',15:'Wioślarstwo',17:'Wędrówka',21:'E-rower'};
const RUNLIKE=new Set([1,11,17]), RIDELIKE=new Set([2,21]);
const STRENGTH_SUB=20; // FIT sub_sport strength_training
function sportCat(s,sub){return sub===STRENGTH_SUB?'gym':RUNLIKE.has(s)?'run':RIDELIKE.has(s)?'ride':s===5?'swim':'other';}
/** Krótka nazwa treningu: Bieg, Rower, Pływanie… */
function autoName(sport,sub){return sub===STRENGTH_SUB?'Siłownia':(SPORT[sport]||'Trening');}
/** Opis rodzaju z doprecyzowaniem (bieżnia, trenażer) */
function sportDetail(sport,sub){
  if(sub===STRENGTH_SUB) return 'Siłownia';
  if(sport===1&&sub===1) return 'Bieg na bieżni';
  if(RIDELIKE.has(sport)&&(sub===6||sub===58)) return 'Rower stacjonarny';
  return SPORT[sport]||'Trening';
}
/** Rozpoznaje nazwy nadane automatycznie przez starsze wersje („Poranny bieg”…) */
const OLD_AUTO=/^(Poranny|Poranna|Poranne|Popołudniowy|Popołudniowa|Popołudniowe|Wieczorny|Wieczorna|Wieczorne|Nocny|Nocna|Nocne) /;
function sportLabel(sport,sub){return sportDetail(sport,sub);}

/* ===== Analiza ===== */
function hav(a1,o1,a2,o2){const R=6371008.8,r=Math.PI/180;const dA=(a2-a1)*r,dO=(o2-o1)*r;const x=Math.sin(dA/2)**2+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dO/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));}
const RUN_DISTS=[400,1000,1609.34,3000,5000,10000,15000,21097.5,42195];
const PW_DURS=[5,10,15,30,60,120,300,600,1200,1800,3600,5400,7200];

function analyze(msgs){
  const by=g=>msgs.filter(m=>m.g===g);
  const fid=(by(0)[0]||{}).f||{};
  const sess=(by(18)[0]||{}).f||{};
  const spm=(by(12)[0]||{}).f||{};
  const devs=by(23).map(m=>m.f);
  const creator=devs.find(d=>d[0]===0)||devs.find(d=>d[2]===fid[1])||{};
  const sport=sess[5]??spm[0]??0, sub=sess[6]??spm[1]??0;
  const cat=sportCat(sport,sub);

  /* rekordy (scalanie po znaczniku czasu) */
  const recs=[], xUnits={};
  for(const m of by(20)){
    const f=m.f; if(f[253]==null) continue;
    const t=f[253]+FIT_EPOCH;
    let r=recs.length&&recs[recs.length-1].t===t?recs[recs.length-1]:null;
    if(!r){r={t};recs.push(r);}
    const set=(k,v)=>{if(v!=null&&typeof v==='number'&&isFinite(v))r[k]=v;};
    if(typeof f[0]==='number'&&typeof f[1]==='number'&&!(f[0]===0&&f[1]===0)){set('lat',f[0]*180/2147483648);set('lon',f[1]*180/2147483648);}
    set('alt',f[78]!=null?f[78]/5-500:f[2]!=null?f[2]/5-500:null);
    set('hr',f[3]);
    if(typeof f[4]==='number') set('cad',f[4]+(typeof f[53]==='number'?f[53]/128:0));
    set('d',f[5]!=null?f[5]/100:null);
    set('spd',f[73]!=null?f[73]/1000:f[6]!=null?f[6]/1000:null);
    set('pw',f[7]); set('tmp',f[13]);
    set('vo',f[39]!=null?f[39]/10:null); set('gct',f[41]!=null?f[41]/10:null);
    set('sl',f[85]!=null?f[85]/10:null); set('vr',f[83]!=null?f[83]/100:null);
    set('gctb',f[84]!=null?f[84]/100:null); set('rr',f[108]!=null?f[108]/100:null);
    if(typeof f[30]==='number'){const v=f[30];const pct=v&0x7F;if(pct>0&&pct<100)set('lrb',v&0x80?100-pct:pct);}

/** Granice stref w wartościach bezwzględnych: [{id,name,lo,hi}] */
function zonesFor(cat,type){
  const st=S.settings,def=ZONE_DEF[type],c=customZ(cat,type);
  return def.base.map((q,i)=>{
    let lo,hi;
    if(type==='pace'){
      if(c){lo=i<c.length?c[i]:0;hi=i===0?Infinity:c[i-1];}
      else{const tp=st.thrPace||285;lo=q[2]*tp;hi=q[3]>9?Infinity:q[3]*tp;}
    }else{
      const base=type==='hr'?st.maxHr:st.ftp;
      if(c){lo=i===0?0:c[i-1];hi=i<c.length?c[i]:Infinity;}
      else{lo=q[2]*base;hi=q[3]>2?Infinity:q[3]*base;}
    }
    return{id:q[0],name:q[1],lo,hi};
  });
}
function zoneLabel(type,z){
  if(type==='pace')return z.hi===Infinity?`wolniej niż ${dur(z.lo)} /km`:z.lo===0?`szybciej niż ${dur(z.hi)} /km`:`${dur(z.hi)}–${dur(z.lo)} /km`;
  const u=ZONE_DEF[type].unit;return z.hi===Infinity?`${Math.round(z.lo)}+ ${u}`:z.lo===0?`do ${Math.round(z.hi)} ${u}`:`${Math.round(z.lo)}–${Math.round(z.hi)} ${u}`;
}
function zoneSub(cat,type){
  const st=S.settings,who=zcat(cat)==='ride'?'rower':'bieg';
  if(customZ(cat,type))return `własne strefy (${who})`;
  return type==='hr'?`wg tętna maks. ${st.maxHr} bpm (${who})`:type==='pw'?`wg FTP ${st.ftp} W`:`wg tempa progowego ${dur(st.thrPace||285)} /km`;
}
function histZoneTimes(hist,binW,zones){
  const out=zones.map(()=>0);if(!hist)return out;
  hist.s.forEach((sec,i)=>{if(!sec)return;const v=((hist.o||0)+i)*binW+(binW>1?binW/2:0);let k=zones.findIndex(z=>v>=z.lo&&v<z.hi);if(k<0)k=v<zones[0].lo?0:zones.length-1;out[k]+=sec;});
  return out;
}
const sumArr=(a,b)=>a.map((v,i)=>v+(b[i]||0));
const ZCOLS={hr:HR_COL,pace:PACE_COL,pw:ZCOL};
const ZTITLE={hr:'Strefy tętna',pace:'Strefy tempa',pw:'Strefy mocy'};
function zoneBlockFor(cat,type,times,title){
  const zs=zonesFor(cat,type);
  return zoneBlock(title||ZTITLE[type],zoneSub(cat,type),zs.map(z=>[z.id,z.name,zoneLabel(type,z)]),times,ZCOLS[type]);
}

  const blocks=[['run','Bieg',[['hr','Tętno'],['pace','Tempo']]],['ride','Rower',[['hr','Tętno'],['pw','Moc']]]];
  return `<div class="zed"><h3>Strefy</h3><p class="help" style="margin:0 0 10px">Domyślnie strefy liczą się z tętna maks., tempa progowego i FTP. Zaznacz „własne”, aby wpisać granice ręcznie – osobno dla biegu i roweru. Wpisujesz górną granicę każdej strefy (dla tempa: granicę od strony wolniejszej).</p>
  <div class="seg zseg" role="tablist">${blocks.map(([c,l],i)=>`<button type="button" data-zc="${c}" aria-pressed="${i===0}">${l}</button>`).join('')}</div>
  ${blocks.map(([c,l,types],i)=>`<div class="zc" data-zcp="${c}" ${i?'hidden':''}>${types.map(([t,tl])=>{
    const cust=!!customZ(c,t);const zs=zonesFor(c,t);
    return `<fieldset class="zf" data-c="${c}" data-t="${t}"><legend><label><input type="checkbox" class="zon" ${cust?'checked':''} ${own?'':'disabled'}> ${tl}: własne strefy</label></legend>
      <div class="zrows">${zs.map((z,k)=>{const last=t==='pace'?k===zs.length-1:k===zs.length-1;
        const val=t==='pace'?(k<zs.length-1?dur(z.lo):''):(k<zs.length-1?Math.round(z.hi):'');
        const lbl=t==='pace'?(k===0?'wolniej niż':last?'':'do'):(last?'':'do');
        return `<div class="zr"><b>${z.id}</b><span class="zn2">${z.name}</span>${last?`<span class="muted zrest">${t==='pace'?'szybciej':'powyżej'}</span>`:`<span class="muted">${lbl}</span><input class="zin" inputmode="${t==='pace'?'text':'numeric'}" value="${val}" ${cust&&own?'':'disabled'}><span class="muted">${ZONE_DEF[t].unit}</span>`}</div>`;}).join('')}</div></fieldset>`;}).join('')}</div>`).join('')}
  </div>`;
}
function bindZoneEditor(d){
  d.querySelectorAll('[data-zc]').forEach(b=>b.onclick=()=>{d.querySelectorAll('[data-zc]').forEach(x=>x.setAttribute('aria-pressed',x===b));d.querySelectorAll('[data-zcp]').forEach(p=>p.hidden=p.dataset.zcp!==b.dataset.zc);});
  d.querySelectorAll('.zf').forEach(f=>{const cb=f.querySelector('.zon');cb.onchange=()=>f.querySelectorAll('.zin').forEach(i=>i.disabled=!cb.checked);});
}
function readZoneEditor(d){
  const out={run:{},ride:{}};
  for(const f of d.querySelectorAll('.zf')){
    if(!f.querySelector('.zon').checked)continue;
    const c=f.dataset.c,t=f.dataset.t,name=(c==='ride'?'Rower':'Bieg')+', '+(t==='hr'?'tętno':t==='pace'?'tempo':'moc');
    const vals=[...f.querySelectorAll('.zin')].map(i=>{const v=i.value.trim();if(t==='pace'){const m=v.match(/^(\d{1,2})[:.,](\d{2})$/);return m&&+m[2]<60?+m[1]*60+ +m[2]:NaN;}return parseFloat(v.replace(',','.'));});
    if(vals.some(v=>!isFinite(v)||v<=0))throw new Error(`${name}: uzupełnij wszystkie granice${t==='pace'?' w formacie min:s, np. 5:30':''}.`);
    for(let i=1;i<vals.length;i++){if(t==='pace'?vals[i]>=vals[i-1]:vals[i]<=vals[i-1])throw new Error(`${name}: granice muszą ${t==='pace'?'być coraz szybsze':'rosnąć'} od S1 do ${ZONE_DEF[t].base[ZONE_DEF[t].base.length-1][0]}.`);}
    out[c][t]=vals;
  }
  return out;
}

/* ===== Komunikacja z Google Apps Script ===== */
const HAS_GAS=!!(window.google&&google.script&&google.script.run);
const API_URL=(window.__API_URL__&&/^https:\/\/script\.google\.com\//.test(window.__API_URL__))?window.__API_URL__:null; // wersja z GitHub Pages
const HAS_API=HAS_GAS||!!API_URL;
// operacje bezpieczne do powtórzenia (nie tworzą duplikatów)
const RETRY_OK=new Set(['init','sync','streams','chatClear','chatSeen','seen','claudeDocs','fit','updateActivity','planDone','setRest','rate','planApprove','saveSettings']);
async function apiFetch(action,payload,attempt=0){
  // zwykłe żądanie POST (text/plain – bez zapytania wstępnego CORS) do aplikacji Apps Script
  let r;
  try{r=await fetch(API_URL,{method:'POST',redirect:'follow',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:S.key,action,payload:payload||{}})});}
  catch(e){
    // Google czasem zwraca chwilowy błąd bez nagłówków CORS – ponów raz po chwili
    if(attempt<2&&RETRY_OK.has(action)){await new Promise(z=>setTimeout(z,800*(attempt+1)));return apiFetch(action,payload,attempt+1);}
    throw new Error('Brak połączenia z serwerem (spróbuj ponownie za chwilę)');}
  const t=await r.text();let o;
  try{o=JSON.parse(t);}catch(e){
    if(attempt<2&&RETRY_OK.has(action)){await new Promise(z=>setTimeout(z,800*(attempt+1)));return apiFetch(action,payload,attempt+1);}
    throw new Error('Błędna odpowiedź serwera'+(r.status&&r.status!==200?' ('+r.status+')':''));}
  if(o.error)throw new Error(o.error);return o.data;
}
function api(action,payload){
  if(!HAS_GAS&&API_URL)return apiFetch(action,payload);
  return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(r=>{let o;try{o=JSON.parse(r);}catch(e){return rej(new Error('Błędna odpowiedź serwera'));}o.error?rej(new Error(o.error)):res(o.data);})
      .withFailureHandler(e=>rej(e instanceof Error?e:new Error(String(e&&e.message||e)))).api(S.key,action,JSON.stringify(payload||{}));
  });
}
async function boot(){
  render();
  document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(a){e.preventDefault();go(a.getAttribute('href'));}});
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>S.redraw&&S.redraw(),120);});
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>S.redraw&&S.redraw());
  setupDrop();
  if(!HAS_API) return goLocal();
  let k=(window.__KEY__||'').trim();
  try{if(k)localStorage.setItem('dt_key',k);else k=localStorage.getItem('dt_key')||'';}catch(e){}
  if(!k) return showLogin();
  S.key=k;
  // 1) natychmiast: dane zapamiętane w urządzeniu, 2) w tle: świeże dane z serwera
  const cached=cacheLoad();
  if(cached){applyInit(cached);S.fromCache=true;setSyncDot(true);}
  try{const d=await api('init');cacheSave(d);
    if(cached){setSyncDot(false);if(d.stamp===cached.stamp&&d.role===cached.role)applyQuiet(d);else applyInitSoft(d,true);}
    else applyInit(d);}
  catch(e){setSyncDot(false);
    if(e.message==='auth'){cacheClear();try{localStorage.removeItem('dt_key');}catch(_){}return showLogin('Ten kod dostępu jest nieprawidłowy.');}
    if(cached){toast('Brak połączenia – pokazuję ostatnio zapisane dane.',6000);}
    else{$('#main').innerHTML=`<div class="wrap loading">Nie udało się połączyć z danymi: ${esc(e.message)}</div>`;return;}}
  setInterval(()=>{if(document.visibilityState==='visible')sync();},45000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync();});
}
function applyInit(d){
  S.me={role:d.role,isOwner:d.role==='athlete',name:d.names[d.role]};
  S.names=d.names;S.coachLink=d.coachLink||null;S.importInfo=d.importInfo||null;S.rest=d.restHr||{};S.plan=d.planning||[];S.ratings=d.ratings||{};S.ai=d.ai||null;S.chat=d.chat||[];S.chatSeen=d.chatSeen||0;
  S.settings={...DEFAULTS,...(d.settings||{})};
  S.acts=new Map(d.activities.map(a=>[a.id,a]));
  S.comments=d.comments;S.state=d.seen||{since:Date.now(),seen:{}};S.coachSeen=d.coachSeen||null;S.stamp=d.stamp;
  S.ready=true;render();
}
async function sync(){
  if(S.syncing||!S.ready||S.local)return;S.syncing=true;
  try{
    const d=await api('sync');
    if(d.chat)setChat(d.chat,d.chatSeen,true);
    if(d.stamp!==S.stamp){const fresh=await api('init');cacheSave(fresh);applyInitSoft(fresh);}
    else if(JSON.stringify(d.comments)!==JSON.stringify(S.comments)){S.comments=d.comments;softRender();}
  }catch(e){console.warn(e);}finally{S.syncing=false;}
}

const CACHE_V=1;
function cacheKey(){let h=0;for(const c of String(S.key||''))h=(h*31+c.charCodeAt(0))|0;return 'dt_cache_'+CACHE_V+'_'+(h>>>0).toString(36);}
function cacheLoad(){try{const t=localStorage.getItem(cacheKey());if(!t)return null;const o=JSON.parse(t);return o&&o.activities?o:null;}catch(e){return null;}}
function cacheSave(d){try{const t=JSON.stringify(d);if(t.length>3500000)return;localStorage.setItem(cacheKey(),t);}catch(e){try{localStorage.removeItem(cacheKey());}catch(_){}}}
function cacheClear(){try{Object.keys(localStorage).filter(k=>k.startsWith('dt_cache_')||k.startsWith('dt_st_')).forEach(k=>localStorage.removeItem(k));}catch(e){}}
function setSyncDot(on){let el=$('#syncdot');if(!el){el=document.createElement('span');el.id='syncdot';el.className='syncdot';el.innerHTML='<i></i><span class="lbl">Aktualizuję…</span>';el.title='Pobieram najnowsze dane';const w=$('#who');w&&w.parentElement.insertBefore(el,w);}el.hidden=!on;}

function applyQuiet(d){S.state=d.seen||S.state;S.coachSeen=d.coachSeen||S.coachSeen;S.importInfo=d.importInfo||S.importInfo;S.coachLink=d.coachLink||S.coachLink;if(d.ai)S.ai=d.ai;if(d.chat)setChat(d.chat,d.chatSeen,false);updateChatBadge();}
/* przebiegi (wykresy) – ostatnie 8 w urządzeniu */
function stCacheGet(id){try{const t=localStorage.getItem('dt_st_'+id);return t?JSON.parse(t):null;}catch(e){return null;}}
function stCachePut(id,v){try{const t=JSON.stringify(v);if(t.length>600000)return;let idx=JSON.parse(localStorage.getItem('dt_st_idx')||'[]').filter(x=>x!==id);idx.unshift(id);
  while(idx.length>8){localStorage.removeItem('dt_st_'+idx.pop());}localStorage.setItem('dt_st_'+id,t);localStorage.setItem('dt_st_idx',JSON.stringify(idx));}catch(e){}}

  S.settings={...DEFAULTS,...(d.settings||{})};S.acts=new Map(d.activities.map(a=>[a.id,a]));S.comments=d.comments;S.stamp=d.stamp;if(d.coachSeen)S.coachSeen=d.coachSeen;S.rest=d.restHr||S.rest||{};S.plan=d.planning||S.plan||[];S.ratings=d.ratings||S.ratings||{};if(d.ai)S.ai=d.ai;if(d.chat)setChat(d.chat,d.chatSeen,false);
  if(r.view==='act'&&prev&&S.acts.get(r.id)&&prev.name===S.acts.get(r.id).name&&prev.desc===S.acts.get(r.id).desc)softRender();else render();
}

/* ===== Wgrywanie plików ===== */
function pickFiles(){
  // bez filtra „accept”: telefony nie znają typu .fit i wyszarzają takie pliki
  const i=document.createElement('input');i.type='file';i.multiple=true;i.style.display='none';document.body.appendChild(i);
  i.onchange=()=>{const all=[...i.files];const fit=all.filter(f=>/\.fit$/i.test(f.name));i.remove();
    if(!fit.length){if(all.length)toast('Wybierz pliki z rozszerzeniem .fit.');return;}
    if(fit.length<all.length)toast(`Pominięto ${all.length-fit.length} plików innego typu.`);
    importFiles(fit);};
  i.click();
}
function setupDrop(){
  let n=0;
  addEventListener('dragenter',e=>{if(!isOwner())return;e.preventDefault();n++;document.body.classList.add('drop-on');});
  addEventListener('dragleave',()=>{if(--n<=0){n=0;document.body.classList.remove('drop-on');}});
  addEventListener('dragover',e=>{if(isOwner())e.preventDefault();});
  addEventListener('drop',e=>{if(!isOwner())return;e.preventDefault();n=0;document.body.classList.remove('drop-on');
    const fs=[...e.dataTransfer.files].filter(f=>/\.fit$/i.test(f.name));if(fs.length)importFiles(fs);else toast('Przeciągnij pliki z rozszerzeniem .fit.');});
}
function toB64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
async function importFiles(files){
  if(!isOwner()){toast('Wgrywać pliki może tylko zawodnik.');return;}
  let ok=0,dup=0,lastId=null;const errs=[];
  for(const [i,file] of files.entries()){
    toast(`Analizuję i zapisuję ${i+1} z ${files.length}: ${file.name}`,120000);
    try{
      const buf=await file.arrayBuffer();
      const {summary,full}=analyze(parseFit(buf));
      const id=(summary.start/1000|0)+'-'+summary.device.key.replace(/[^A-Za-z0-9_-]/g,'');
      if(S.acts.has(id)){dup++;continue;}
      summary.id=id;summary.file=file.name;summary.createdAt=Date.now();summary.desc='';
      let st,target=1800;do{st=downsample(full,target);target=Math.floor(target*0.7);}while(JSON.stringify(st).length>900000&&target>200);
      if(!S.local){const r=await api('addActivity',{summary,streams:st,fit:toB64(buf),fileName:file.name});if(r.duplicate){dup++;continue;}S.stamp=null;}
      S.acts.set(id,summary);S.streams.set(id,st);stCachePut(id,st);ok++;lastId=id;
    }catch(e){console.error(e);errs.push(file.name+': '+e.message);}
  }
  let msg=[];if(ok)msg.push(`Dodano: ${ok}`);if(dup)msg.push(`pominięto duplikaty: ${dup}`);if(errs.length)msg.push(`błędy: ${errs.join('; ')}`);
  toast(msg.join(', ')||'Brak plików do dodania.',errs.length?9000:3500);
  if(ok===1&&lastId)go('#/a/'+lastId);else render();
}
async function getStreams(id){
  if(S.streams.has(id))return S.streams.get(id);
  if(S.local)return null;
  const c=stCacheGet(id);if(c){S.streams.set(id,c);return c;} // przebieg się nie zmienia – można go trzymać w urządzeniu
  const v=await api('streams',{id});if(v){S.streams.set(id,v);stCachePut(id,v);}return v;
}
async function deleteActivity(a){

    S.acts.delete(a.id);S.comments=S.comments.filter(c=>c.activityId!==a.id);
    toast('Usunięto aktywność.');go('#/');
  }catch(e){toast('Nie udało się usunąć: '+e.message);}
}
async function saveAct(a,patch){

  if(!S.local){try{await api('updateActivity',{id:a.id,patch});}catch(e){toast('Nie zapisano zmian: '+e.message);}}
}
function saveBlob(name,blob){
  const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=name;l.target='_blank';document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(u);l.remove();},4000);

async function downloadFit(a){
  try{toast('Pobieram plik…');const r=await api('fit',{id:a.id});const bin=atob(r.b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    saveBlob(r.name||'aktywnosc.fit',new Blob([u],{type:'application/octet-stream'}));toast('Gotowe.');}catch(e){toast('Nie pobrano pliku: '+e.message);}

function plural(n,a,b,c){if(n===1)return a;const m10=n%10,m100=n%100;return m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c;}
function fitCanvas(c,h){const w=c.parentElement.clientWidth||300;const r=devicePixelRatio||1;c.width=Math.round(w*r);c.height=Math.round(h*r);c.style.height=h+'px';const g=c.getContext('2d');g.setTransform(r,0,0,r,0,0);g.clearRect(0,0,w,h);return{g,w,h};}
function drawFF(all){
  const c=$('#ff');if(!c)return;const {g,w,h}=fitCanvas(c,190);
  const day=864e5,today=new Date();today.setHours(0,0,0,0);
  const loads=new Map();let first=today.getTime();
  for(const a of all){const L=loadOf(a);if(!L)continue;const d=new Date(a.start);d.setHours(0,0,0,0);const k=d.getTime();loads.set(k,(loads.get(k)||0)+L.v);first=Math.min(first,k);}
  let ctl=0,atl=0;const pts=[];
  for(let t=first;t<=today.getTime();t+=day){const L=loads.get(t)||0;const tsb=ctl-atl;ctl+=(L-ctl)/42;atl+=(L-atl)/7;pts.push({t,ctl,atl,tsb});}
  const last=pts[pts.length-1]||{ctl:0,atl:0,tsb:0};
  $('#ffv').innerHTML=`<div><b class="num" style="color:var(--accent)">${nf(last.ctl)}</b><span>kondycja</span></div><div><b class="num" style="color:var(--hr)">${nf(last.atl)}</b><span>zmęczenie</span></div><div><b class="num">${Math.round(last.tsb)>0?'+':''}${nf(Math.round(last.tsb)||0)}</b><span>forma</span></div>`;
  const show=pts.slice(-120);if(show.length<2){g.fillStyle=css('--muted');g.font='13px Inter';g.fillText('Wykres pojawi się po wgraniu treningów z tętnem lub mocą.',8,h/2);return;}
  const max=Math.max(10,...show.map(p=>Math.max(p.ctl,p.atl))),minT=Math.min(0,...show.map(p=>p.tsb)),maxT=Math.max(0,...show.map(p=>p.tsb));
  const L=30,B=18,top=6,ph=h-B-top,X=i=>L+i/(show.length-1)*(w-L-4);
  const Y=v=>top+(1-v/max)*ph*0.72;const tsbS=Math.max(Math.abs(minT),Math.abs(maxT),1);const Z=top+ph*0.86;const YT=v=>Z-v/tsbS*ph*0.13;
  g.strokeStyle=css('--line');g.fillStyle=css('--muted');g.font='11px Inter';g.lineWidth=1;
  for(const v of [0,max/2,max]){const y=Y(v);g.beginPath();g.moveTo(L,y);g.lineTo(w,y);g.stroke();g.fillText(nf(v),2,y+4);}
  const bw=Math.max(1,(w-L)/show.length-1);
  show.forEach((p,i)=>{g.fillStyle=p.tsb>=0?css('--accent'):css('--hr');g.globalAlpha=.35;const y=YT(p.tsb);g.fillRect(X(i)-bw/2,Math.min(y,Z),bw,Math.abs(y-Z));});g.globalAlpha=1;
  for(const [k,col] of [['ctl','--accent'],['atl','--hr']]){g.strokeStyle=css(col);g.lineWidth=2;g.beginPath();show.forEach((p,i)=>i?g.lineTo(X(i),Y(p[k])):g.moveTo(X(i),Y(p[k])));g.stroke();}
  g.fillStyle=css('--muted');for(let i=0;i<show.length;i+=30){const d=new Date(show[i].t);g.fillText(d.toLocaleDateString('pl-PL',{day:'numeric',month:'short'}),X(i)-10,h-3);}
}
function drawWeeks(all){
  const c=$('#wb');if(!c)return;const {g,w,h}=fitCanvas(c,120);
  const wk=weekStart(Date.now());const ws=[];for(let i=11;i>=0;i--)ws.push(wk-i*7*864e5);
  const vals=ws.map(k=>all.filter(a=>weekStart(a.start)===k).reduce((x,a)=>x+(a.s.mt||0),0)/3600);
  const max=Math.max(1,...vals);const bw=(w-8)/12;

  vals.forEach((v,i)=>{const bh=(h-30)*v/max;g.fillStyle=i===11?css('--accent'):css('--line');g.beginPath();g.roundRect?g.roundRect(4+i*bw+3,h-16-bh,bw-6,bh,3):g.rect(4+i*bw+3,h-16-bh,bw-6,bh);g.fill();
    if(v>0){g.fillStyle=css('--muted');g.textAlign='center';g.fillText(nf(v,v<10?1:0),4+i*bw+bw/2,h-20-bh);}});

async function exportCsv(a){

  const xk=Object.keys(st.x||{});

  saveBlob(nm,new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));
}

function zoneBlock(title,sub,zs,times,cols=ZCOL){

function drawDetailCanvases(){
  const c=$('#pcurve');if(!c||!V)return;const a=V.a;const {g,w,h}=fitCanvas(c,220);
  const all=[...S.acts.values()].filter(o=>o.cat===a.cat);
  const durs=PW_DURS.filter(d=>a.best.pw[d]!=null);const allBest={};
  for(const o of all)for(const [d,v] of Object.entries(o.best?.pw||{}))allBest[d]=Math.max(allBest[d]||0,v);
  const ad=PW_DURS.filter(d=>allBest[d]);const max=Math.max(...Object.values(allBest),...Object.values(a.best.pw))*1.08;
  const L=38,B=20,lx=d=>Math.log(d),x0=lx(5),x1=lx(Math.max(...ad));
  const X=d=>L+(lx(d)-x0)/(x1-x0||1)*(w-L-8),Y=v=>6+(1-v/max)*(h-B-6);
  g.font='11px Inter';g.strokeStyle=css('--line');g.fillStyle=css('--muted');
  for(const v of [0,max/3,max*2/3]){g.beginPath();g.moveTo(L,Y(v));g.lineTo(w,Y(v));g.stroke();g.fillText(nf(v),2,Y(v)+4);}
  for(const [d,l] of [[5,'5 s'],[60,'1 min'],[300,'5 min'],[1200,'20 min'],[3600,'1 h']])if(d<=Math.max(...ad))g.fillText(l,X(d)-8,h-4);
  const line=(ds,src,col,wd)=>{g.strokeStyle=col;g.lineWidth=wd;g.beginPath();ds.forEach((d,i)=>i?g.lineTo(X(d),Y(src[d])):g.moveTo(X(d),Y(src[d])));g.stroke();};
  line(ad,allBest,css('--muted'),1.5);line(durs,a.best.pw,css('--pw'),2.5);
}

/* --- wykresy przebiegu --- */
function panelDefs(){
  const a=V.a,st=V.st,P=[];const run=isRun(a);
  const has=k=>st[k]&&st[k].some(v=>v!=null&&v!==0);
  if(has('alt'))P.push({k:'alt',l:'Wysokość',c:'--alt',h:96,fill:true,f:v=>nf(v)+' m'});
  if(has('spd')&&a.s.d>50)P.push({k:'spd',l:spdLbl(a),c:'--spd',h:76,f:v=>spdTxt(a,v),ax:v=>run?pace(v):nf(v*3.6),lo:run?1.2:0});
  if(has('hr'))P.push({k:'hr',l:'Tętno',c:'--hr',h:76,f:v=>nf(v)+' bpm'});
  if(has('pw'))P.push({k:'pw',l:'Moc',c:'--pw',h:76,f:v=>nf(v)+' W',lo:0});
  if(has('cad'))P.push({k:'cad',l:'Kadencja',c:'--cad',h:64,f:v=>nf(v*cadMul(a))+' '+cadUnit(a),ax:v=>nf(v*cadMul(a)),lo:run?40:0,zeroNull:true});
  if(has('tmp'))P.push({k:'tmp',l:'Temperatura',c:'--tmp',h:56,f:v=>nf(v)+' °C'});
  if(has('gct'))P.push({k:'gct',l:'Kontakt z podłożem',c:'--dyn',h:56,f:v=>nf(v)+' ms',zeroNull:true});
  if(has('vo'))P.push({k:'vo',l:'Oscylacja pionowa',c:'--dyn',h:56,f:v=>nf(v/10,1)+' cm',ax:v=>nf(v/10,1),zeroNull:true});
  if(has('sl'))P.push({k:'sl',l:'Długość kroku',c:'--dyn',h:56,f:v=>nf(v/1000,2)+' m',ax:v=>nf(v/1000,2),zeroNull:true});
  if(has('vr'))P.push({k:'vr',l:'Współczynnik pionowy',c:'--dyn',h:56,f:v=>nf(v,1)+' %',zeroNull:true});
  if(has('rr'))P.push({k:'rr',l:'Oddech',c:'--dyn',h:56,f:v=>nf(v,1)+' /min'});
  if(has('lrb'))P.push({k:'lrb',l:'Balans L/P (lewa)',c:'--pw',h:56,f:v=>nf(v)+' %'});
  for(const [n,o] of Object.entries(st.x||{}))if(o.v.some(v=>v!=null))P.push({k:'x:'+n,l:n,c:'--xf',h:56,f:v=>nf(v,Math.abs(v)<10?2:0)+(o.u?' '+o.u:''),ys:o.v});
  return P;
}
function hiddenKey(){return 'dt_hidden_'+(V.a.cat||'other');}
const HID_MEM={}; // zapas, gdy przeglądarka blokuje pamięć strony

function buildCharts(){
  const host=$('#charts');host.innerHTML='';
  if(!V.allPanels){V.allPanels=panelDefs();renderChannelPicker();}
  const hid=getHidden();V.panels=panelDefs().filter(p=>V.fs&&V.fsOnly?p.k===V.fsOnly:!hid.has(p.k));
  if(!V.panels.length&&V.fsOnly){V.fsOnly=null;V.panels=panelDefs().filter(p=>!hid.has(p.k));}
  if(!V.panels.length&&V.allPanels.length){setHidden(new Set());V.panels=panelDefs();}
  if(!V.panels.length){host.innerHTML='<div class="loading" style="padding:30px">Plik nie zawiera danych do wykresów.</div>';return;}
  V.panels.forEach((p,i)=>{
    p.ys=p.ys||V.st[p.k];if(p.zeroNull)p.ys=p.ys.map(v=>v===0?null:v);
    const vs=p.ys.filter(v=>v!=null).sort((x,y)=>x-y);
    let lo=vs[Math.floor(vs.length*0.01)]??0,hi=vs[Math.min(vs.length-1,Math.floor(vs.length*0.995))]??1;
    if(p.k==='spd'&&p.lo)lo=Math.max(p.lo,lo);else if(p.lo!=null)lo=Math.min(lo,p.lo);
    if(hi-lo<1e-6){hi=lo+1;}const pad=(hi-lo)*0.08;p.yr=[p.k==='pw'?0:lo-pad,hi+pad];
    p.last=i===V.panels.length-1;p.baseH=p.h;
    const el=document.createElement('div');el.className='cp';
    el.innerHTML=`<div class="cp-h"><span class="cp-l" style="--c:var(${p.c})">${esc(p.l)}</span><span class="cp-v"></span><button class="cp-fs" title="${V.fs&&V.fsOnly?'Pokaż wszystkie wykresy':'Powiększ ten wykres'}" aria-label="Powiększ wykres ${esc(p.l)}">${V.fs&&V.fsOnly?'▤':'⛶'}</button></div><div class="cp-c"><canvas></canvas><canvas class="ov"></canvas></div>`;
    el.querySelector('.cp-fs').onclick=()=>{if(V.fs&&V.fsOnly){V.fsOnly=null;buildCharts();drawAll();}else enterFs(p.k);};
    host.appendChild(el);p.cv=el.querySelector('canvas');p.ov=el.querySelector('.ov');p.val=el.querySelector('.cp-v');
    p.avg=avgOf(p.ys);
    bindPointer(p.ov,p);
  });
  const ar=$('#avgrow');if(ar)ar.innerHTML=`<span class="avl">Średnia</span>`+V.panels.filter(p=>['spd','hr','cad','pw','tmp'].includes(p.k)&&p.avg!=null).map(p=>`<div><span>${esc(p.l)}</span><b>${esc(p.f(p.k==='spd'?(V.a.s.spd||p.avg):p.k==='cad'&&V.a.s.cad?V.a.s.cad:p.avg))}</b></div>`).join('');
}
function renderStreamZones(){
  const a=V.a,st=V.st,host=$('#zgrid');if(!host||!isRun(a)||host.dataset.done)return;host.dataset.done='1';
  const T=st.t,out=[];
  {
    const zs=zonesFor('run','pace');let t;
    if(a.paceHist)t=histZoneTimes(a.paceHist,a.paceHist.w,zs);
    else if(st.spd){t=zs.map(()=>0);for(let i=1;i<T.length;i++){const dt=T[i]-T[i-1],v=st.spd[i];if(dt<=0||dt>30||v==null||v<0.5)continue;const p=1000/v;let k=zs.findIndex(z=>p>=z.lo&&p<z.hi);t[k<0?0:k]+=dt;}}
    if(t)out.push(zoneBlockFor('run','pace',t));

  for(let i=0;i<lat.length-1;i+=step){const seg=[];let s=0,c=0;for(let j=i;j<=Math.min(lat.length-1,i+step);j++){if(lat[j]!=null)seg.push([lat[j],lon[j]]);if(vals&&vals[j]!=null){s+=vals[j];c++;}}
    if(seg.length>1)L.polyline(seg,{color:mt==='route'?'#FC4C02':c?ramp((s/c-lo)/(hi-lo)):'#888',weight:4.5,opacity:1,interactive:false}).addTo(route);}
  if(all.length){L.circleMarker(all[0],{radius:6,color:'#fff',weight:2.5,fillColor:'#2F9E44',fillOpacity:1}).addTo(route);L.circleMarker(all[all.length-1],{radius:6,color:'#fff',weight:2.5,fillColor:'#16202A',fillOpacity:1}).addTo(route);}
  const leg=$('#mapleg');const P=(V.allPanels||V.panels).find(p=>p.k===mt);

function lmOverlay(i){

  ${canComment()?`<div class="compose"><div id="anc"></div><textarea id="cmtxt" placeholder="${isOwner()?'Odpowiedz trenerowi…':'Uwaga dla zawodnika…'}" maxlength="3000"></textarea><div class="row"><span class="hint kbd">Ctrl+Enter wysyła</span><button class="btn primary" id="cmsend">Dodaj uwagę</button></div></div>`
   :`<div class="compose"><span class="hint">Masz dostęp tylko do podglądu. Aby dodawać uwagi, poproś zawodnika o uprawnienia Współtwórcy (lub Edytora, jeśli jesteś spoza jego organizacji).</span></div>`}`;
  const ta=$('#cmtxt');if(ta){ta.value=prev;ta.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))send();};$('#cmsend').onclick=send;}

const ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const ymdLabel=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});};
async function saveRest(day,bpm){
  const old=S.rest[day];
  if(bpm==null)delete S.rest[day];else S.rest[day]=bpm;
  toast(bpm==null?'Usunięto wpis.':`Zapisano: ${bpm} bpm (${ymdLabel(day)}).`,1800);
  bgApi('setRest',{date:day,bpm},()=>{if(old==null)delete S.rest[day];else S.rest[day]=old;});
  return true;
}
function parseBpm(v){v=String(v||'').trim();if(!v)return null;const n=Math.round(parseFloat(v.replace(',','.')));if(!isFinite(n)||n<25||n>130)throw new Error('Podaj tętno w zakresie 25–130 bpm.');return n;}
async function editRest(day){
  if(!isOwner())return;
  const cur=S.rest[day];const v=prompt(`Tętno spoczynkowe – ${ymdLabel(day)} (bpm).\nZostaw puste, aby usunąć wpis.`,cur??'');
  if(v===null)return;
  try{const bpm=parseBpm(v);if(bpm===(cur??null))return;if(await saveRest(day,bpm))render();}catch(e){toast(e.message);}
}

      :`<div class="rest-in"><span class="muted">Dziś:</span> <b>${v!=null?v+' bpm':'brak wpisu'}</b></div>`}</div>
    <div class="rest-week">${last.map(([k,x])=>`<div class="${k===today?'td':''}"><span>${new Date(k+'T12:00').toLocaleDateString('pl-PL',{weekday:'short'})}</span><b>${x??'–'}</b></div>`).join('')}
      <div class="avg"><span>śr. 7 dni</span><b>${avg!=null?nf(avg):'–'}</b></div></div>
    ${withChart?`<div class="restchart"><div class="rest-cth"><p class="sub" style="margin:0" id="restStat">${(()=>{const {v,avg:a}=restMonthVals(new Date().getFullYear(),new Date().getMonth()+1);return restStatTxt(new Date().getFullYear(),new Date().getMonth()+1,v,a);})()}</p>
      <div class="seg" id="restRange"><button data-rr="month" aria-pressed="${S.restRange!=='all'}">W miesiącu</button><button data-rr="all" aria-pressed="${S.restRange==='all'}">Pełen okres</button></div></div>

function bindRestPanel(){

function restMonthVals(y,m){const v=Object.entries(S.rest).filter(([k])=>k.startsWith(`${y}-${String(m).padStart(2,'0')}-`)).map(x=>x[1]);return{v,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null};}
function restChartSection(y,m,title){const {v,avg}=restMonthVals(y,m);

function bindRestChart(root,y,m){root.querySelectorAll('[data-rr]').forEach(b=>b.onclick=()=>{S.restRange=b.dataset.rr;root.querySelectorAll('[data-rr]').forEach(x=>x.setAttribute('aria-pressed',x===b));const {v,avg}=restMonthVals(y,m);$('#restStat').innerHTML=restStatTxt(y,m,v,avg);drawRestChart(y,m);});}
function restStatTxt(y,m,mRest,mAvg){
  if(S.restRange==='all'){const v=Object.keys(S.rest).sort();if(!v.length)return 'Brak wpisów.';const vals=v.map(k=>S.rest[k]);const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    const last7=v.slice(-7).map(k=>S.rest[k]);const a7=last7.reduce((a,b)=>a+b,0)/last7.length;
    return `Od ${new Date(v[0]+'T12:00').toLocaleDateString('pl-PL')} do ${new Date(v[v.length-1]+'T12:00').toLocaleDateString('pl-PL')}: ${vals.length} ${plural(vals.length,'pomiar','pomiary','pomiarów')}, min. ${Math.min(...vals)}, maks. ${Math.max(...vals)}, śr. ${nf(avg)} bpm, ostatnie 7 pomiarów: ${nf(a7)} bpm. Linia przerywana – średnia z 7 pomiarów.`;}
  return mRest.length?`min. ${Math.min(...mRest)}, maks. ${Math.max(...mRest)}, śr. ${nf(mAvg)} bpm`:'';

function drawRestAll(){
  const c=$('#restcv');if(!c)return;const {g,w,h}=fitCanvas(c,190);const keys=Object.keys(S.rest).sort();
  if(!keys.length){g.fillStyle=css('--muted');g.font='13px Inter';g.fillText('Brak wpisów tętna spoczynkowego.',8,h/2);return;}
  const t=k=>new Date(k+'T12:00').getTime();const t0=t(keys[0]),t1=Math.max(t(keys[keys.length-1]),t0+864e5);
  const vs=keys.map(k=>S.rest[k]);const lo=Math.min(...vs)-3,hi=Math.max(...vs)+3;
  const L=34,R=8,T=8,B=20,X=x=>L+(x-t0)/(t1-t0)*(w-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(h-T-B);
  g.font='11px Inter';g.strokeStyle=css('--line');g.fillStyle=css('--muted');
  for(const v of [lo+1,(lo+hi)/2,hi-1]){g.beginPath();g.moveTo(L,Y(v));g.lineTo(w-R,Y(v));g.stroke();g.fillText(nf(v),2,Y(v)+4);}
  const n=Math.min(6,keys.length);for(let i=0;i<n;i++){const k=keys[Math.round(i*(keys.length-1)/Math.max(1,n-1))];const x=X(t(k));g.textAlign=i===0?'left':i===n-1?'right':'center';g.fillText(new Date(k+'T12:00').toLocaleDateString('pl-PL',{day:'numeric',month:'short'}),x,h-4);}g.textAlign='left';
  g.strokeStyle=css('--hr');g.globalAlpha=.45;g.lineWidth=1.5;g.beginPath();keys.forEach((k,i)=>i?g.lineTo(X(t(k)),Y(S.rest[k])):g.moveTo(X(t(k)),Y(S.rest[k])));g.stroke();g.globalAlpha=1;
  g.fillStyle=css('--hr');if(keys.length<=120)for(const k of keys){g.beginPath();g.arc(X(t(k)),Y(S.rest[k]),2.5,0,7);g.fill();}
  g.strokeStyle=css('--ink');g.lineWidth=2;g.setLineDash([5,4]);g.beginPath();keys.forEach((k,i)=>{const sl=keys.slice(Math.max(0,i-6),i+1).map(q=>S.rest[q]);const a=sl.reduce((x,y)=>x+y,0)/sl.length;i?g.lineTo(X(t(k)),Y(a)):g.moveTo(X(t(k)),Y(a));});g.stroke();g.setLineDash([]);
}
function drawRestChart(y,m){
  if(S.restRange==='all')return drawRestAll();
  const c=$('#restcv');if(!c)return;const {g,w,h}=fitCanvas(c,150);const nd=new Date(y,m,0).getDate();
  const pts=[];for(let d=1;d<=nd;d++){const k=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;if(S.rest[k]!=null)pts.push([d,S.rest[k]]);}
  if(!pts.length){g.fillStyle=css('--muted');g.font='13px Inter';g.fillText(isOwner()?'Brak wpisów w tym miesiącu. Kliknij ♥ w dniu kalendarza, aby dodać.':'Brak wpisów w tym miesiącu.',8,h/2);return;}
  const vs=pts.map(p=>p[1]);let lo=Math.min(...vs)-3,hi=Math.max(...vs)+3;
  const L=34,R=8,T=8,B=20,X=d=>L+(d-1)/(nd-1)*(w-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(h-T-B);
  g.font='11px Inter';g.strokeStyle=css('--line');g.fillStyle=css('--muted');
  for(const v of [lo+1,(lo+hi)/2,hi-1]){g.beginPath();g.moveTo(L,Y(v));g.lineTo(w-R,Y(v));g.stroke();g.fillText(nf(v),2,Y(v)+4);}
  for(const d of [1,8,15,22,nd])g.fillText(String(d),X(d)-4,h-4);
  g.strokeStyle=css('--hr');g.lineWidth=2;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));g.stroke();
  g.fillStyle=css('--hr');for(const p of pts){g.beginPath();g.arc(X(p[0]),Y(p[1]),3,0,7);g.fill();}
}

/* odczucie zawodnika po treningu: 1 – lekki … 5 – zmęczony */
const EFFORT=[null,['Lekki','#2F9E44'],['Umiarkowany','#74B816'],['Średni','#E8B923'],['Ciężki','#F08C00'],['Zmęczony','#E0393E']];
function skipStats(list){const sk=list.filter(p=>p.skip);if(!sk.length)return'';const c={};sk.forEach(p=>c[p.skip.reason]=(c[p.skip.reason]||0)+1);
  return `<div><b class="num" style="color:var(--hr)">${sk.length}</b><span>niewykonanych: ${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${SKIP_R[k]||k} ${n}`).join(', ')}</span></div>`;}
function effAvg(list){const e=list.filter(p=>planEffort(p));if(!e.length)return'';const a=e.reduce((s,p)=>s+planEffort(p),0)/e.length;const r=Math.round(a);
  return `<div><b class="num" style="color:${EFFORT[r][1]}">${nf(a,1)}</b><span>śr. odczucie po treningu (${EFFORT[r][0].toLowerCase()}, ${e.length} ${plural(e.length,'ocena','oceny','ocen')})</span></div>`;}
function effortChip(e,small){return e?`<span class="eff${small?' sm':''}" style="--ec:${EFFORT[e][1]}" title="Odczucie zawodnika: ${e}/5 – ${EFFORT[e][0]}">${e}/5 ${EFFORT[e][0].toLowerCase()}</span>`:'';}
function effortPicker(p,mode){
  return `<div class="effp"><span class="effq">${mode==='done'?'Zmień odczucie':'Jak ciężki był trening?'} <span class="muted">1 – lekki, 5 – zmęczony</span></span><div class="effb">${[1,2,3,4,5].map(n=>`<button class="effo${p.effort===n?' on':''}" data-eff="${n}" data-id="${p.id}" style="--ec:${EFFORT[n][1]}" title="${n} – ${EFFORT[n][0]}"><b>${n}</b><span>${EFFORT[n][0]}</span></button>`).join('')}</div>
    ${mode==='new'?`<button class="btn ghost effskip" data-done="${p.id}" data-v="1">Zapisz bez oceny</button>`:''}</div>`;
}
const daysTo=day=>{const [y,m,d]=day.split('-').map(Number);const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(y,m-1,d)-t)/864e5);};
const daysTxt=n=>n===0?'dziś':n===1?'jutro':`za ${n} ${plural(n,'dzień','dni','dni')}`;
const isWalk=a=>a.sport===11||a.sport===17;
const sameCat=(ps,a)=>{
  if(ps==='sauna'||ps==='test')return false;
  if(ps==='walk')return isWalk(a);
  if(ps==='run')return a.cat==='run'&&!isWalk(a);
  if(ps==='trainer')return a.cat==='ride'&&!!a.indoor;
  if(ps==='swim')return a.cat==='swim';
  if(ps==='other')return !['run','ride','swim','gym'].includes(a.cat);
  return a.cat===ps;};
function actsOn(day){return [...S.acts.values()].filter(a=>ymd(a.start)===day);}
const actEffortFor=p=>{const a=actsOn(p.day).find(a=>sameCat(p.sport,a)&&a.effort);return a?a.effort:null;};
const planEffort=p=>p.effort||actEffortFor(p);
function planDone(p){return !p.skip&&(!!p.done||!!p.change||actsOn(p.day).some(a=>sameCat(p.sport,a)));}
/* trening niewykonany – powód podaje zawodnik */
const SKIP_R={zmeczenie:'zmęczenie',tetno:'wysokie tętno',czas:'brak czasu',inna:'inna przyczyna'};
const skipTxt=p=>p.skip?(SKIP_R[p.skip.reason]||'inna')+(p.skip.note?`: ${p.skip.note}`:''):'';
function skipForm(p){return `<div class="skipf" id="skip-${p.id}" hidden><span class="effq">Dlaczego trening nie został wykonany?</span>
  <div class="skipr">${Object.entries(SKIP_R).map(([k,l],i)=>`<label class="skr"><input type="radio" name="sr-${p.id}" value="${k}"${i===0?' checked':''}><span>${l.charAt(0).toUpperCase()+l.slice(1)}</span></label>`).join('')}</div>
  <label class="f skipn">Komentarz${''}<input id="skn-${p.id}" maxlength="200" placeholder="np. 3 noce słabego snu, tętno spoczynkowe 62"></label>
  <div class="pact"><button class="btn skipsave" data-skip="${p.id}">Zapisz jako niewykonany</button><button class="btn ghost skipcancel" data-skipc="${p.id}">Anuluj</button></div></div>`;}

function raceCards(){
  const up=planOf('race').filter(r=>daysTo(r.day)>=0).sort((a,b)=>a.day<b.day?-1:1);
  const past=planOf('race').filter(r=>daysTo(r.day)<0).sort((a,b)=>a.day>b.day?-1:1);
  if(!up.length&&!past.length)return `<section class="panel races-empty"><h2>Starty</h2><p class="sub" style="margin:0">Brak zaplanowanych startów.</p></section>`;
  return `<section class="sec" style="margin-top:0"><div class="sec-h"><h2>Starty</h2><span class="muted">A – ważny, B – mniej ważny, C – treningowy</span></div>
    <div class="races">${up.map(r=>{const n=daysTo(r.day);const [l,desc,col]=PRIO[r.prio];return `<button class="race prio-${r.prio}" data-day="${r.day}" style="--pc:${col}">
      <div class="rc-days"><b class="num">${n===0?'Dziś':n===1?'Jutro':n}</b><span>${n>1?plural(n,'dzień','dni','dni')+' do startu':'start'}</span></div>
      <div class="rc-main"><div><span class="prio" style="background:${col}">${l}</span><span class="muted">${desc}</span></div><b>${esc(r.name)}</b>
        <span>${RACE_DISC[r.disc]||''}${r.dist?', '+esc(r.dist):''}</span>
        <span class="muted">${dateLong(new Date(r.day+'T12:00').getTime())}</span>
        ${r.goal?`<span>Przewidywany czas: <b>${esc(r.goal)}</b></span>`:''}</div></button>`;}).join('')}</div>
    ${past.length?`<details class="pastr"><summary>Starty zakończone (${past.length})</summary><ul>${past.map(r=>`<li><span class="prio" style="background:${PRIO[r.prio][2]}">${r.prio}</span> ${esc(r.name)}, ${new Date(r.day+'T12:00').toLocaleDateString('pl-PL')}${r.dist?', '+esc(r.dist):''}${r.goal?', plan '+esc(r.goal):''}</li>`).join('')}</ul></details>`:''}
  </section>`;
}

function renderDisp(ym){
  const main=$('#main');const now=new Date();
  let [y,m]=(ym||'').split('-').map(Number);if(!y||!m){y=now.getFullYear();m=now.getMonth()+1;}
  S.dispYM=`${y}-${m}`;
  const dk=d=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const first=(new Date(y,m-1,1).getDay()+6)%7,nd=new Date(y,m,0).getDate();
  const cells=[];for(let i=0;i<first;i++)cells.push(null);for(let d=1;d<=nd;d++)cells.push(d);while(cells.length%7)cells.push(null);
  const weeks=[];for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));
  const prev=m===1?`${y-1}-12`:`${y}-${m-1}`,next=m===12?`${y+1}-1`:`${y}-${m+1}`;
  const todayK=ymd(Date.now());
  const monthDays=Array.from({length:nd},(_,i)=>dk(i+1));
  const freeM=monthDays.reduce((s,k)=>s+availMin(k),0),planM=monthDays.reduce((s,k)=>s+planReal(k).reduce((x,p)=>x+p.dur,0),0);
  const doneM=monthDays.reduce((s,k)=>s+actsOn(k).reduce((x,a)=>x+(a.s.mt||a.s.et||0),0),0)/60;
  const plansM=monthDays.flatMap(k=>planReal(k));const doneCnt=plansM.filter(planDone).length;
  const cell=d=>{if(!d)return'<td class="out"></td>';const k=dk(d);
    const races=planOf('race',k),av=planOf('avail',k).sort((a,b)=>a.from<b.from?-1:1),pl=planOf('plan',k),acts=actsOn(k);
    return `<td class="dd${k===todayK?' today':''}${k<todayK?' past':''}" data-day="${k}" tabindex="0" role="button" aria-label="${ymdLabel(k)}">
      <span class="dn">${d}</span>
      ${pl.length||av.length?`<span class="dsumm">${pl.length?`${pl.length} tr., ${mfmt(pl.reduce((x,p)=>x+p.dur,0))}`:''}${pl.length&&av.length?' / ':''}${av.length?`wolne ${mfmt(availMin(k))}`:''}</span>`:''}
      ${races.map(r=>`<span class="rbadge" style="--pc:${PRIO[r.prio][2]}" title="Start ${r.prio}: ${esc(r.name)}">${icon('race',12)}<b>${r.prio}</b> <span class="nm">${esc(r.name)}</span></span>`).join('')}
      ${isNoAvail(k)?`<span class="av none" title="Brak dyspozycji">${icon('skip',12)}<span class="nm">brak </span>dysp.</span>`:av.length?`<span class="av" title="Wolny czas">${icon('free',14)}<span class="nm">wolne </span>${(m=>m<60?m+'′':nf(m/60,m%60?1:0)+' h')(availMin(k))}</span>`:''}
      ${pl.map(p=>`<span class="pl ${p.author==='coach'?'bycoach':'byath'}${planDone(p)?' done':''}${p.skip?' skip':''}${p.change?' chg':''}${byAthlete(p)&&!p.approve?' pend':''}" style="--c:${PLAN_SPORTS[p.sport][1]}" title="${PLAN_SPORTS[p.sport][0]} ${p.dur} min${p.zones&&p.zones.length?' ('+zonesTxt(p.zones)+')':''}${planDone(p)?' – wykonany':''}">${icon(p.sport,15)}<span class="nm">${PLAN_SPORTS[p.sport][0]} </span>${p.dur}′${p.zones&&p.zones.length?`<span class="nm zmini"> ${zonesTxt(p.zones)}</span>`:''}${planDone(p)?`<span class="ok">${icon('done',11)}</span>`:''}</span>${p.desc?`<span class="pdx">${esc(p.desc)}</span>`:''}`).join('')}
      ${acts.filter(a=>!pl.some(p=>sameCat(p.sport,a))).map(a=>`<span class="dn-act" title="Wykonany: ${esc(a.name)}">${icon(catIcon(a),12)}${icon('done',10)}<span class="nm"> ${esc(CATS[catOf(a)][0])}</span></span>`).join('')}
    </td>`;};
  main.innerHTML=`<div class="wrap home disp">
    <div class="cal-h"><h1>Plan <span class="muted wrange">${MONTHS[m-1]} ${y}</span></h1>
      <div class="cal-nav">${viewToggle('month',`${y}-${m}`,ymd(mondayOf(new Date(y,m-1,y===now.getFullYear()&&m===now.getMonth()+1?now.getDate():1))))}<a class="btn" href="#/dyspozycja/${prev}" aria-label="Poprzedni miesiąc">‹</a><a class="btn" href="#/dyspozycja/${now.getFullYear()}-${now.getMonth()+1}">Bieżący</a><a class="btn" href="#/dyspozycja/${next}" aria-label="Następny miesiąc">›</a></div></div>
    <div class="tbl-wrap"><table class="cal-grid disp-grid"><thead><tr>${['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(d=>`<th>${d}</th>`).join('')}<th>Suma</th></tr></thead><tbody>
      ${weeks.map((w,wi)=>{const ks=w.filter(Boolean).map(dk);const fr=ks.reduce((s,k)=>s+availMin(k),0),pp=ks.reduce((s,k)=>s+planReal(k).reduce((x,p)=>x+p.dur,0),0);
        const mon=w[0]?dk(w[0]):null;
        return `<tr>${w.map(cell).join('')}<td class="wk"><span class="wf">wolne <b>${fr?mfmt(fr):'–'}</b></span><span class="wp">plan <b>${pp?mfmt(pp):'–'}</b>${ks.flatMap(k=>planReal(k)).length?` <i>(${ks.flatMap(k=>planReal(k)).length} tr.)</i>`:''}</span>
          ${isOwner()&&mon&&!fr?`<button class="btn ghost copyw" data-mon="${mon}">↻ jak poprz. tydz.</button>`:''}</td></tr>`;}).join('')}
    </tbody></table></div>
    <div class="legend disp-leg"><span><i class="lsw coachsw"></i><em>plan trenera</em></span><span><i class="lsw athsw"></i><em>plan zawodnika</em></span><span style="color:var(--ok)">${icon('free')}<em>wolny czas</em></span>${Object.entries(PLAN_SPORTS).map(([k,[l,c]])=>`<span style="color:${c}">${icon(k)}<em>${l}</em></span>`).join('')}<span style="color:var(--ok)">${icon('done')}<em>wykonany</em></span><span style="color:var(--hr)">${icon('race')}<em>start</em> <b class="prio" style="background:var(--hr)">A</b><b class="prio" style="background:#F59F00">B</b><b class="prio" style="background:var(--spd)">C</b></span></div>
    <section class="sec"><div class="sec-h"><h2>Analiza wolnego czasu i planu</h2></div>
    <section class="cal-stats">
      <div><b class="num" style="color:var(--ok)">${mfmt(freeM)}</b><span>wolnego czasu w miesiącu</span></div>
      <div><b class="num">${mfmt(planM)}</b><span>zaplanowanych treningów (${plansM.length})</span></div>
      <div><b class="num">${plansM.length?nf(doneCnt/plansM.length*100)+'%':'–'}</b><span>planu wykonane (${doneCnt}/${plansM.length})${plansM.some(p=>p.skip)?`, niewykonane: ${plansM.filter(p=>p.skip).length}`:''}</span></div>
      ${skipStats(plansM)}
      <div><b class="num">${mfmt(doneM)}</b><span>wykonanych treningów</span></div>
      ${effAvg(plansM)}
    </section>
    </section>
    <div class="sec">${raceCards()}</div>
  </div>`;
  bindViewToggle();
  main.querySelectorAll('td.dd').forEach(td=>{td.onclick=()=>openDay(td.dataset.day);td.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDay(td.dataset.day);}};});
  main.querySelectorAll('.race').forEach(b=>b.onclick=()=>openDay(b.dataset.day));
  main.querySelectorAll('.copyw').forEach(b=>b.onclick=async e=>{e.stopPropagation();const mon=b.dataset.mon;const [yy,mm,dd]=mon.split('-').map(Number);const pm=ymd(new Date(yy,mm-1,dd-7));
    b.disabled=true;try{const r=S.local?{copied:0,planning:S.plan}:await api('planCopyWeek',{from:pm,to:mon});S.plan=r.planning;toast(r.copied?`Skopiowano ${r.copied} ${plural(r.copied,'wpis','wpisy','wpisów')} z poprzedniego tygodnia.`:'W poprzednim tygodniu nie było wpisów do skopiowania.');render();}catch(err){toast(err.message);b.disabled=false;}});
  S.redraw=null;
}

async function planSave(kind,item){
  const r=S.local?{id:item.id||'p'+Date.now(),kind,author:S.me.role,...item}:await api('planSave',{kind,item});
  S.plan=(S.plan||[]).filter(x=>x.id!==r.id).concat([r]);return r;
}
async function planDel(id){if(!S.local)await api('planDelete',{id});S.plan=S.plan.filter(x=>x.id!==id);}
/* akceptacja trenera dla treningów zaplanowanych przez zawodnika */
const byAthlete=p=>p.author==='athlete';
function approveBadge(p,small){if(p.logged)return `<span class="appr logd${small?' sm':''}">dodany ręcznie</span>`;if(!byAthlete(p))return'';return p.approve?`<span class="appr ok${small?' sm':''}" title="Zaakceptowany przez trenera">${icon('done',small?11:13)} zaakceptowany</span>`:`<span class="appr wait${small?' sm':''}" title="Czeka na akceptację trenera">czeka na akceptację</span>`;}
function approveNote(p){return byAthlete(p)&&p.approve&&p.approve.note?`<div class="apnote"><b>Uwagi trenera:</b> ${esc(p.approve.note)}</div>`:'';}
const canEditPlan=(x)=>x.kind==='avail'?isOwner():x.kind==='race'?true:x.author===S.me.role;

  const d=$('#setdlg');
  // ponowne otwarcie tego samego dnia (po zapisie) – zachowaj przewinięcie okna
  const keepTop=d.open&&S.openDayKey===day?(d.querySelector('.dlg-b')?.scrollTop||0):0;
  S.openDayKey=day;const own=isOwner();
  const av=planOf('avail',day),pl=planOf('plan',day),races=planOf('race',day),acts=actsOn(day);
  const free=availMin(day);
  const sportOpts=Object.entries(PLAN_SPORTS).map(([k,[l]])=>`<option value="${k}">${l}</option>`).join('');
  d.innerHTML=`<div class="dlg-h"><h2>${ymdLabel(day).replace(/^./,c=>c.toUpperCase())}</h2><button class="icon-btn" onclick="this.closest('dialog').close()" aria-label="Zamknij">✕</button></div>
  <div class="dlg-b day-dlg">
    ${own?`    <section><h3><span style="color:var(--ok)">${icon('free',18)}</span>Wolny czas${free?` <span class="muted">(${mfmt(free)})</span>`:''}</h3>
      ${av.length?`<ul class="items">${av.map(a=>`<li><b>${a.none?'Brak dyspozycji':mfmt(avDur(a))}</b>${a.from?` <span class="muted">(${a.from}–${a.to})</span>`:''}${a.note?` – ${esc(a.note)}`:''}${own?`<button class="del" data-del="${a.id}">Usuń</button>`:''}</li>`).join('')}</ul>`:`<p class="muted">Ile masz czasu na trening tego dnia?</p>`}

      <div class="frow"><label class="grow">Notatka (opcjonalnie)<input id="avNote" maxlength="200" placeholder="np. tylko basen" value="${esc(av.length===1?av[0].note||'':'')}"></label></div>
    </section>
`:''}
    <section><h3><span style="color:var(--accent)">${icon('run',18)}</span>Plan treningu</h3>

  ?`<div class="pact"><button class="btn ghost" data-apedit="${p.id}">Zmień uwagi</button><button class="btn ghost" data-apundo="${p.id}">Cofnij akceptację</button></div>`
  :''}<div class="apbox" id="ap-${p.id}" ${p.approve?'hidden':''}><label class="skipn">Uwagi dla zawodnika (opcjonalnie)<textarea id="apn-${p.id}" rows="2" maxlength="1000" placeholder="np. OK, ale trzymaj tętno w S2">${esc(p.approve?.note||'')}</textarea></label>
  <div class="pact"><button class="btn apbtn" data-approve="${p.id}">${icon('done',18)} ${p.approve?'Zapisz uwagi':'Akceptuj trening'}</button></div></div></div>`:''}${statusBlock(p,own)}${canEditPlan(p)?`<button class="del" data-del="${p.id}">Usuń</button>`:''}</li>`).join('')}</ul>`:'<p class="muted">Brak zaplanowanego treningu.</p>'}
      <div class="frow"><label>Rodzaj treningu<select id="plSport">${sportOpts}</select></label><label>Czas treningu (min)<input id="plDur" inputmode="numeric" value="60"></label></div>
      <div class="zsel"><span class="effq">Strefy <span class="muted">(opcjonalnie, można kilka)</span></span><div class="zbtns" id="plZones">${ZN.map((z,i)=>`<button type="button" class="zb2" data-z="${z}" style="--zc:${HR_COL[i]}">${z}</button>`).join('')}</div></div>
      <div class="frow"><label class="grow">Opis treningu<textarea id="plDesc" rows="3" maxlength="2000" placeholder="np. 10 min rozgrzewki, 6×800 m w S4, 10 min schłodzenia"></textarea></label></div>
      <div class="frow end"><button class="btn primary" id="plAdd">Dodaj trening</button></div>
    </section>
    ${own?logFormHtml(day):''}
    <section><h3><span style="color:var(--hr)">${icon('race',18)}</span>Start w zawodach</h3>
      ${races.length?`<ul class="items">${races.map(r=>`<li><span class="prio" style="background:${PRIO[r.prio][2]}">${r.prio}</span> <b>${esc(r.name)}</b> <span class="muted">${PRIO[r.prio][1]}</span><br>${RACE_DISC[r.disc]}${r.dist?', '+esc(r.dist):''}${r.goal?`, przewidywany czas <b>${esc(r.goal)}</b>`:''}<span class="muted">, ${daysTxt(Math.max(0,daysTo(day)))}</span>${r.note?`<p class="pdesc">${esc(r.note)}</p>`:''}<button class="del" data-del="${r.id}">Usuń</button></li>`).join('')}</ul>`:''}
      <details ${races.length?'':'open'}><summary>${races.length?'Dodaj kolejny start':'Dodaj start'}</summary>
        <div class="frow"><label class="grow">Nazwa zawodów<input id="raName" maxlength="100" placeholder="np. Półmaraton Łódź"></label><label>Priorytet<select id="raPrio"><option value="A">A – ważny</option><option value="B">B – mniej ważny</option><option value="C" selected>C – treningowy</option></select></label></div>
        <div class="frow"><label>Dyscyplina<select id="raDisc">${Object.entries(RACE_DISC).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label><label>Dystans<input id="raDist" maxlength="40" placeholder="np. 21,1 km"></label><label>Przewidywany czas<input id="raGoal" maxlength="8" placeholder="g:mm:ss"></label></div>

/* ===== Analiza Claude (codzienna) ===== */
function mdLite(t){
  const lines=String(t||'').split('\n');let h='',inList=false;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  for(const raw of lines){const l=raw.trim();
    if(/^[-*] /.test(l)){if(!inList){h+='<ul>';inList=true;}h+=`<li>${inl(l.slice(2))}</li>`;continue;}
    if(inList){h+='</ul>';inList=false;}
    if(!l)continue;
    if(/^#{1,3} /.test(l))h+=`<h3>${inl(l.replace(/^#+ /,''))}</h3>`;else h+=`<p>${inl(l)}</p>`;}
  if(inList)h+='</ul>';return h;
}

function aiPanelOld(){

  if(!ai.enabled)return '';
  const list=ai.list||[];const idx=Math.min(S.aiIdx||0,Math.max(0,list.length-1));const cur=list[idx];
  return `<section class="panel aip"><div class="aih"><h2><span class="aidot"></span>Analiza Claude</h2>
    <div class="aictl">${list.length>1?`<select id="aiSel" aria-label="Wybierz dzień">${list.map((x,i)=>`<option value="${i}"${i===idx?' selected':''}>${new Date(x.day+'T12:00').toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short'})}</option>`).join('')}</select>`:''}
    ${isOwner()?`<button class="btn" id="aiRun">Analizuj teraz</button>`:''}</div></div>

      :`<p class="sub" style="margin:0">Brak analiz. ${ai.auto?'Pierwsza pojawi się dziś ok. 22:00.':''}${isOwner()?' Możesz też kliknąć „Analizuj teraz”.':''}</p>`}
    <p class="aiwarn">Analiza wygenerowana automatycznie przez Claude na podstawie danych z dziennika – nie zastępuje trenera ani lekarza.</p></section>`;
